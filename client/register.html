<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - KV PTA Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <h1>Create Account</h1>
    <p>Register as a new user</p>

    <div id="registerForm">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input class="form-input" id="fullName" type="text" placeholder="Your full name">
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" id="email" type="email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" id="password" type="password" placeholder="••••••••">
      </div>
      <div class="form-group">
        <label class="form-label">Role</label>
        <select class="form-input" id="role">
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
        </select>
      </div>
      <div id="errorMsg" style="color:#c92a2a;font-size:13px;margin-bottom:12px;display:none"></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="handleRegister()">Create account</button>
      <p style="margin-top:16px;font-size:13px;text-align:center;color:var(--gray-500)">
        Already have an account? <a href="/" style="color:var(--dark-blue-600);font-weight:600;text-decoration:none">Sign in</a>
      </p>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
async function handleRegister() {
  const full_name = document.getElementById('fullName').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const role = document.getElementById('role').value;
  const err = document.getElementById('errorMsg');

  if (!full_name || !email || !password) { err.textContent = 'Please fill in all fields'; err.style.display = 'block'; return; }

  try {
    await post('/api/auth/register', { email, password, full_name, role });
    window.location.href = '/';
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
  }
}
</script>
</body>
</html>
