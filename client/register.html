<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KV PTA Management — Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <rect x="4" y="4" width="32" height="32" rx="8" fill="var(--primary-light)" stroke="var(--primary)" stroke-width="2"/>
          <path d="M16 20l4 4 8-10" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>
          <h1 style="font-size:20px;font-weight:800;margin:0">Create Account</h1>
          <p style="font-size:13px;color:var(--text-secondary);margin:2px 0 0 0">Join the KV PTA Supervision Platform</p>
        </div>
      </div>

      <div id="registerForm">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input class="form-input" id="full_name" type="text" placeholder="John Doe">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-input" id="email" type="email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-input" id="password" type="password" placeholder="Create a password" autocomplete="new-password">
        </div>
        <div id="errorMsg" style="color:var(--red);font-size:13px;margin-bottom:12px;display:none"></div>
        <button class="btn btn-primary" onclick="handleRegister()">Create Account</button>
        <div class="login-footer">
          Already have an account? <a href="/">Sign in</a>
        </div>
      </div>
    </div>
    <div style="position:fixed;bottom:16px;left:0;right:0;text-align:center;font-size:11px;color:var(--text-muted);z-index:1">
      KV PTA Management &middot; Final Year Project Supervision
    </div>
  </div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
const user = getUser();
if (user) { redirectByRole(user.role); }

async function handleRegister() {
  const full_name = document.getElementById('full_name').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const err = document.getElementById('errorMsg');

  if (!full_name || !email || !password) { err.textContent = 'Please fill in all fields'; err.style.display = 'block'; return; }

  try {
    const data = await post('/api/auth/register', { full_name, email, password });
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    redirectByRole(data.user.role);
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
  }
}
</script>
</body>
</html>
