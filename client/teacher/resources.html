<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resources - KV PTA Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="main-content">
  <div id="header" class="top-header"></div>
  <div class="content-area">
    <div class="card" style="padding:0;margin-bottom:16px">
      <div style="padding:16px 20px;border-bottom:1px solid var(--gray-200);font-weight:600;font-size:14px;color:var(--dark-blue-800)">Upload Resource</div>
      <div style="padding:20px">
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <input class="form-input" id="resTitle" placeholder="Resource title" style="flex:1;min-width:200px">
          <input type="file" id="fileInput" style="flex:2;min-width:300px;padding:6px 12px;border:1px solid var(--gray-300);border-radius:6px;font-size:14px">
          <button class="btn btn-primary" onclick="uploadResource()">Upload</button>
        </div>
        <div id="resMsg" style="font-size:13px;margin-top:8px;display:none"></div>
      </div>
    </div>

    <div class="card" style="padding:0">
      <div style="padding:16px 20px;border-bottom:1px solid var(--gray-200);font-weight:600;font-size:14px;color:var(--dark-blue-800)">My Resources</div>
      <div class="table-container"><table><thead><tr><th>Title</th><th>Type</th><th>Uploaded</th></tr></thead><tbody id="resourcesList"></tbody></table></div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
const user = requireAuth();
if (user.role !== 'teacher') redirectByRole(user.role);
renderPage('Resources');

async function load() {
  const resources = await get('/api/teacher/resources');
  const tbody = document.getElementById('resourcesList');
  if (resources.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" class="empty-state" style="padding:32px"><p>No resources uploaded</p></td></tr>';
  } else {
    tbody.innerHTML = resources.map(r => `
      <tr><td><a href="${r.file_url}" target="_blank" style="color:var(--dark-blue-600);text-decoration:none;font-weight:600">${r.title}</a></td><td><span class="badge badge-blue">${r.file_type || '-'}</span></td><td style="color:var(--gray-400);font-size:13px">${new Date(r.created_at).toLocaleDateString()}</td></tr>
    `).join('');
  }
}

async function uploadResource() {
  const title = document.getElementById('resTitle').value;
  const fileInput = document.getElementById('fileInput');
  const msg = document.getElementById('resMsg');

  if (!title) { msg.textContent = 'Title required'; msg.style.color = '#c92a2a'; msg.style.display = 'block'; return; }
  if (!fileInput.files || !fileInput.files[0]) { msg.textContent = 'Please select a file'; msg.style.color = '#c92a2a'; msg.style.display = 'block'; return; }

  const file = fileInput.files[0];

  try {
    const reader = new FileReader();
    reader.onload = async function(e) {
      const base64 = e.target.result.split(',')[1];
      try {
        await post('/api/teacher/resources', { title, file_data: base64, file_type: file.type });
        document.getElementById('resTitle').value = '';
        fileInput.value = '';
        msg.textContent = 'Resource uploaded!';
        msg.style.color = '#2b8a3e'; msg.style.display = 'block';
        load();
        setTimeout(() => msg.style.display = 'none', 2000);
      } catch (err) {
        msg.textContent = err.message;
        msg.style.color = '#c92a2a'; msg.style.display = 'block';
      }
    };
    reader.readAsDataURL(file);
  } catch (e) {
    msg.textContent = e.message;
    msg.style.color = '#c92a2a'; msg.style.display = 'block';
  }
}

load();
</script>
</body>
</html>
