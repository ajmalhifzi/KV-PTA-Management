<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Uploads - KV PTA Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="main-content">
  <div id="header" class="top-header"></div>
  <div class="content-area">

    <div class="card" style="padding:0;margin-bottom:16px">
      <div style="padding:16px 20px;border-bottom:1px solid var(--gray-200);font-weight:600;font-size:14px;color:var(--dark-blue-800)">Upload File for Student</div>
      <div style="padding:20px">
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <select class="form-input" id="studentSelect" style="flex:1;min-width:200px">
            <option value="">— Select Student —</option>
          </select>
          <input class="form-input" id="fileName" placeholder="File name" style="flex:1;min-width:160px">
          <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.txt,.md,.ppt,.pptx,.xls,.xlsx,.csv,.jpg,.jpeg,.png,.zip" style="flex:2;min-width:280px;padding:6px 12px;border:1px solid var(--gray-300);border-radius:6px;font-size:14px">
          <select class="form-input" id="fileCategory" style="width:160px">
            <option value="supplementary">Supplementary</option>
            <option value="formal">Formal Document</option>
          </select>
          <button class="btn btn-primary" onclick="uploadForStudent()">Upload</button>
        </div>
        <div id="uploadMsg" style="font-size:13px;margin-top:8px;display:none"></div>
      </div>
    </div>

    <div class="card" style="padding:0">
      <div style="padding:16px 20px;border-bottom:1px solid var(--gray-200);font-weight:600;font-size:14px;color:var(--dark-blue-800)">Student Uploads</div>
      <div id="uploadsContainer"></div>
    </div>

  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
const user = requireAuth();
if (user.role !== 'teacher') redirectByRole(user.role);
renderPage('Student Uploads');

async function loadStudents() {
  const students = await get('/api/teacher/students');
  const sel = document.getElementById('studentSelect');
  sel.innerHTML = '<option value="">— Select Student —</option>' +
    students.map(s => `<option value="${s.student_id}" data-group="${s.group_name || ''}">${s.full_name}${s.group_name ? ' (' + s.group_name + ')' : ''}</option>`).join('');
}

async function load() {
  const uploads = await get('/api/teacher/uploads');
  const container = document.getElementById('uploadsContainer');

  const grouped = {};
  for (const u of uploads) {
    const key = u.group_name || '__ungrouped__';
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(u);
  }

  const keys = Object.keys(grouped).sort((a, b) => {
    if (a === '__ungrouped__') return 1;
    if (b === '__ungrouped__') return -1;
    return a.localeCompare(b);
  });

  if (keys.length === 0) {
    container.innerHTML = '<div style="padding:32px;text-align:center;color:var(--gray-400);font-size:14px">No uploads from your students</div>';
    return;
  }

  container.innerHTML = keys.map(key => {
    const list = grouped[key];
    const groupLabel = key === '__ungrouped__' ? 'No Group' : key;
    return `
      <div style="border-bottom:1px solid var(--gray-200)">
        <div style="padding:10px 20px;font-weight:700;font-size:13px;color:var(--dark-blue-700);background:var(--gray-50);text-transform:uppercase;letter-spacing:0.3px">${groupLabel}</div>
        <div class="table-container"><table><thead><tr><th>File</th><th>Student</th><th>Project</th><th>Category</th><th>Uploaded</th></tr></thead><tbody>
          ${list.map(u => `
            <tr>
              <td><a href="/api/files/uploads/${u.id}" target="_blank" style="color:var(--dark-blue-600);text-decoration:none;font-weight:600">${u.file_name}</a></td>
              <td>${u.student_name}</td>
              <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${u.project_title || '-'}</td>
              <td><span class="badge ${u.category === 'formal' ? 'badge-blue' : 'badge-gray'}">${u.category}</span></td>
              <td style="color:var(--gray-400);font-size:13px">${new Date(u.uploaded_at).toLocaleDateString()}</td>
            </tr>
          `).join('')}
        </tbody></table></div>
      </div>
    `;
  }).join('');
}

async function uploadForStudent() {
  const studentId = document.getElementById('studentSelect').value;
  const fileInput = document.getElementById('fileInput');
  const fileNameInput = document.getElementById('fileName');
  const category = document.getElementById('fileCategory').value;
  const msg = document.getElementById('uploadMsg');

  if (!studentId) { msg.textContent = 'Please select a student'; msg.style.color = '#c92a2a'; msg.style.display = 'block'; return; }
  if (!fileInput.files || !fileInput.files[0]) { msg.textContent = 'Please select a file'; msg.style.color = '#c92a2a'; msg.style.display = 'block'; return; }

  const file = fileInput.files[0];
  if (file.size > 25 * 1024 * 1024) { msg.textContent = 'File too large. Max 25MB.'; msg.style.color = '#c92a2a'; msg.style.display = 'block'; return; }

  const file_name = fileNameInput.value || file.name;
  msg.textContent = 'Uploading...'; msg.style.color = '#2b8a3e'; msg.style.display = 'block';

  try {
    const reader = new FileReader();
    reader.onload = async function(e) {
      const base64 = e.target.result.split(',')[1];
      try {
        await post('/api/teacher/upload-for-student', { student_id: studentId, file_name, file_data: base64, category });
        fileInput.value = ''; fileNameInput.value = '';
        msg.textContent = 'File uploaded!'; msg.style.color = '#2b8a3e';
        load();
        setTimeout(() => msg.style.display = 'none', 2000);
      } catch (err) { msg.textContent = err.message; msg.style.color = '#c92a2a'; msg.style.display = 'block'; }
    };
    reader.readAsDataURL(file);
  } catch (e) { msg.textContent = e.message; msg.style.color = '#c92a2a'; msg.style.display = 'block'; }
}

loadStudents();
load();
setInterval(load, 5000);
</script>
</body>
</html>
