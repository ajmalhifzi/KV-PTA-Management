<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeting Logs - KV PTA Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="main-content">
  <div id="header" class="top-header"></div>
  <div class="content-area">

    <div class="card" style="padding:0;margin-bottom:16px">
      <div style="padding:16px 20px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;color:var(--text-primary)">New Meeting Log</div>
      <div style="padding:20px">
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <select class="form-input" id="groupSelect" style="flex:1;min-width:180px">
            <option value="">— Select Group —</option>
          </select>

          <div style="position:relative">
            <button type="button" class="btn btn-secondary" style="display:flex;align-items:center;gap:6px" onclick="togglePicker('meetingPicker')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <span id="meetingLabel">Meeting date & time</span>
            </button>
            <div id="meetingPicker" class="picker-popup" style="display:none">
              <div style="font-size:12px;font-weight:600;color:var(--text-primary);margin-bottom:6px">Meeting date & time</div>
              <input type="date" id="meetingDate" class="form-input" style="width:100%;margin-bottom:4px">
              <input type="time" id="meetingTime" class="form-input" style="width:100%;margin-bottom:6px">
              <div style="display:flex;gap:4px;justify-content:flex-end">
                <button type="button" class="btn btn-sm btn-primary" style="font-size:11px;padding:3px 10px" onclick="donePicker('meeting')">Done</button>
                <button type="button" class="btn btn-sm btn-secondary" style="font-size:11px;padding:3px 10px" onclick="clearPicker('meeting')">Clear</button>
              </div>
            </div>
          </div>

          <div style="position:relative">
            <button type="button" class="btn btn-secondary" style="display:flex;align-items:center;gap:6px" onclick="togglePicker('nextPicker')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              <span id="nextLabel">Next meeting</span>
            </button>
            <div id="nextPicker" class="picker-popup" style="display:none">
              <div style="font-size:12px;font-weight:600;color:var(--text-primary);margin-bottom:6px">Next meeting date & time</div>
              <input type="date" id="nextMeetingDate" class="form-input" style="width:100%;margin-bottom:4px">
              <input type="time" id="nextMeetingTime" class="form-input" style="width:100%;margin-bottom:6px">
              <div style="display:flex;gap:4px;justify-content:flex-end">
                <button type="button" class="btn btn-sm btn-primary" style="font-size:11px;padding:3px 10px" onclick="donePicker('next')">Done</button>
                <button type="button" class="btn btn-sm btn-secondary" style="font-size:11px;padding:3px 10px" onclick="clearPicker('next')">Clear</button>
              </div>
            </div>
          </div>

        </div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">
          <textarea class="form-input" id="meetingNotes" placeholder="Meeting notes..." style="flex:2;min-width:250px;resize:vertical;min-height:60px"></textarea>
          <textarea class="form-input" id="actionItems" placeholder="Action items..." style="flex:1;min-width:200px;resize:vertical;min-height:60px"></textarea>
        </div>
        <div style="margin-top:10px;display:flex;gap:8px;align-items:center">
          <button class="btn btn-primary" onclick="createMeeting()">Save Log</button>
          <div id="formMsg" style="font-size:13px;display:none"></div>
        </div>
      </div>
    </div>

    <div class="card" style="padding:0">
      <div style="padding:16px 20px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;color:var(--text-primary)">Meeting Logs</div>
      <div id="meetingsContainer" style="padding:16px 20px"></div>
    </div>

  </div>
</div>

<div id="confirmModal" class="modal-overlay" onclick="if(event.target===this)closeConfirm()">
  <div class="modal" onclick="event.stopPropagation()" style="max-width:380px">
    <h3>Confirm Delete</h3>
    <p style="font-size:14px;color:var(--text-secondary);margin-bottom:16px" id="confirmText"></p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeConfirm()">Cancel</button>
      <button class="btn btn-primary" style="background:#c92a2a" id="confirmBtn">Delete</button>
    </div>
  </div>
</div>

<div id="editModal" class="modal-overlay" onclick="if(event.target===this)closeEditModal()">
  <div class="modal" onclick="event.stopPropagation()" style="max-width:500px">
    <h3>Edit Meeting Log</h3>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:12px">
      <select class="form-input" id="editGroupSelect" style="flex:1;min-width:160px">
        <option value="">— Select Group —</option>
      </select>

      <div style="position:relative">
        <button type="button" class="btn btn-secondary" style="display:flex;align-items:center;gap:6px" onclick="togglePicker('editMeetingPicker')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span id="editMeetingLabel">Meeting date & time</span>
        </button>
        <div id="editMeetingPicker" class="picker-popup" style="display:none">
          <div style="font-size:12px;font-weight:600;color:var(--text-primary);margin-bottom:6px">Meeting date & time</div>
          <input type="date" id="editMeetingDate" class="form-input" style="width:100%;margin-bottom:4px">
          <input type="time" id="editMeetingTime" class="form-input" style="width:100%;margin-bottom:6px">
          <div style="display:flex;gap:4px;justify-content:flex-end">
            <button type="button" class="btn btn-sm btn-primary" style="font-size:11px;padding:3px 10px" onclick="donePicker('editMeeting')">Done</button>
            <button type="button" class="btn btn-sm btn-secondary" style="font-size:11px;padding:3px 10px" onclick="clearPicker('editMeeting')">Clear</button>
          </div>
        </div>
      </div>

      <div style="position:relative">
        <button type="button" class="btn btn-secondary" style="display:flex;align-items:center;gap:6px" onclick="togglePicker('editNextPicker')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span id="editNextLabel">Next meeting</span>
        </button>
        <div id="editNextPicker" class="picker-popup" style="display:none">
          <div style="font-size:12px;font-weight:600;color:var(--text-primary);margin-bottom:6px">Next meeting date & time</div>
          <input type="date" id="editNextMeetingDate" class="form-input" style="width:100%;margin-bottom:4px">
          <input type="time" id="editNextMeetingTime" class="form-input" style="width:100%;margin-bottom:6px">
          <div style="display:flex;gap:4px;justify-content:flex-end">
            <button type="button" class="btn btn-sm btn-primary" style="font-size:11px;padding:3px 10px" onclick="donePicker('editNext')">Done</button>
            <button type="button" class="btn btn-sm btn-secondary" style="font-size:11px;padding:3px 10px" onclick="clearPicker('editNext')">Clear</button>
          </div>
        </div>
      </div>

    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px">
      <textarea class="form-input" id="editMeetingNotes" placeholder="Meeting notes..." style="flex:2;min-width:200px;resize:vertical;min-height:60px"></textarea>
      <textarea class="form-input" id="editActionItems" placeholder="Action items..." style="flex:1;min-width:160px;resize:vertical;min-height:60px"></textarea>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px;align-items:center">
      <button class="btn btn-primary" onclick="saveEditMeeting()">Save Changes</button>
      <button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
      <div id="editFormMsg" style="font-size:13px;display:none"></div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
const user = requireAuth();
if (user.role !== 'teacher') redirectByRole(user.role);
renderPage('Meeting Logs');

let meetingsCache = [];
let editId = null;

async function loadGroups() {
  try {
    const groups = await get('/api/teacher/groups');
    const opts = '<option value="">— Select Group —</option>' +
      groups.filter(g => g.project_id).map(g =>
        `<option value="${g.id}" data-project="${g.project_id}">${g.group_name} (${g.students ? g.students.length : 0} students)</option>`
      ).join('');
    document.getElementById('groupSelect').innerHTML = opts;
    document.getElementById('editGroupSelect').innerHTML = opts;
  } catch (e) {
    document.getElementById('groupSelect').innerHTML = '<option value="">Error loading groups</option>';
  }
}

async function load() {
  let meetings;
  try { meetings = await get('/api/teacher/meetings'); } catch { meetings = []; }
  meetingsCache = meetings;
  const container = document.getElementById('meetingsContainer');

  if (meetings.length === 0) {
    container.innerHTML = '<div style="padding:8px 0;text-align:center;color:var(--text-muted);font-size:13px">No meeting logs yet</div>';
    return;
  }

  const groups = {};
  for (const m of meetings) {
    const key = m.meeting_date.split('T')[0];
    if (!groups[key]) groups[key] = [];
    groups[key].push(m);
  }

  const today = new Date().toISOString().split('T')[0];
  const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
  const labels = { [today]: 'Today', [yesterday]: 'Yesterday' };

  container.innerHTML = Object.keys(groups).sort((a, b) => b.localeCompare(a)).map(key => {
    const d = new Date(key + 'T12:00:00');
    const label = labels[key] || d.toLocaleDateString('en-MY', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', timeZone: 'Asia/Kuala_Lumpur' });
    return `
      <div style="font-weight:700;font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;margin:12px 0 6px">${label}</div>
      ${groups[key].map(m => renderMeetingCard(m)).join('')}
    `;
  }).join('');
}

function fmtDatetime(val) {
  if (!val) return null;
  try {
    const dt = new Date(val);
    return dt.toLocaleString('en-MY', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Kuala_Lumpur' });
  } catch { return val; }
}

function toLocalInput(val) {
  if (!val) return '';
  const dt = new Date(val);
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, '0');
  const d = String(dt.getDate()).padStart(2, '0');
  const h = String(dt.getHours()).padStart(2, '0');
  const min = String(dt.getMinutes()).padStart(2, '0');
  return y + '-' + m + '-' + d + 'T' + h + ':' + min;
}

function localToISO(val) {
  if (!val) return null;
  const offset = new Date().getTimezoneOffset();
  const sign = offset > 0 ? '-' : '+';
  const abs = Math.abs(offset);
  const hrs = String(Math.floor(abs / 60)).padStart(2, '0');
  const min = String(abs % 60).padStart(2, '0');
  return val + sign + hrs + ':' + min;
}

function fmtLabel(dateVal, timeVal, placeholder) {
  if (!dateVal) return placeholder;
  try {
    const dt = new Date(dateVal + (timeVal ? 'T' + timeVal : 'T12:00'));
    const opts = { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'Asia/Kuala_Lumpur' };
    if (timeVal) { opts.hour = '2-digit'; opts.minute = '2-digit'; }
    return dt.toLocaleString('en-MY', opts);
  } catch { return dateVal + (timeVal ? ' ' + timeVal : ''); }
}

function togglePicker(id) {
  const popup = document.getElementById(id);
  const wasHidden = popup.style.display === 'none';
  document.querySelectorAll('.picker-popup').forEach(p => p.style.display = 'none');
  popup.style.display = wasHidden ? 'block' : 'none';
}

function donePicker(prefix) {
  const dateVal = document.getElementById(prefix + 'Date').value;
  const timeVal = document.getElementById(prefix + 'Time').value;
  const labelId = prefix === 'meeting' ? 'meetingLabel' :
                  prefix === 'next' ? 'nextLabel' :
                  prefix === 'editMeeting' ? 'editMeetingLabel' : 'editNextLabel';
  document.getElementById(labelId).textContent = fmtLabel(dateVal, timeVal,
    prefix.includes('edit') ? (prefix.includes('Next') ? 'Next meeting' : 'Meeting date & time') :
    prefix === 'next' ? 'Next meeting' : 'Meeting date & time');
  document.getElementById(prefix + 'Picker').style.display = 'none';
}

function clearPicker(prefix) {
  document.getElementById(prefix + 'Date').value = '';
  document.getElementById(prefix + 'Time').value = '';
  const labelId = prefix === 'meeting' ? 'meetingLabel' :
                  prefix === 'next' ? 'nextLabel' :
                  prefix === 'editMeeting' ? 'editMeetingLabel' : 'editNextLabel';
  document.getElementById(labelId).textContent =
    prefix.includes('Next') ? 'Next meeting' : 'Meeting date & time';
  document.getElementById(prefix + 'Picker').style.display = 'none';
}

// Close pickers when clicking outside
document.addEventListener('click', function(e) {
  document.querySelectorAll('.picker-popup').forEach(p => {
    if (p.style.display !== 'none' && !p.parentElement.contains(e.target)) {
      p.style.display = 'none';
    }
  });
});

function renderMeetingCard(m) {
  const meetingTime = fmtDatetime(m.meeting_date);
  const nextDate = m.next_meeting ? fmtDatetime(m.next_meeting) : null;
  const studentNames = m.students && m.students.length ? m.students.map(s => s.full_name).join(', ') : '';
  return `
    <div style="border:1.5px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:start;gap:8px">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">
            <span style="font-weight:600;font-size:14px;color:var(--text-primary)">${m.group_name}</span>
            <span class="badge badge-blue" style="font-size:9px;padding:1px 6px">Group</span>
            ${studentNames ? '<span style="font-size:11px;color:var(--text-muted)">' + studentNames + '</span>' : ''}
            <span style="font-size:11px;color:var(--text-secondary)">${meetingTime}</span>
          </div>
          <div style="font-size:13px;color:var(--text-secondary);margin-bottom:6px;white-space:pre-wrap">${m.notes}</div>
          ${m.action_items ? '<div style="font-size:12px;color:var(--primary);margin-bottom:4px"><strong>Action:</strong> ' + m.action_items + '</div>' : ''}
          ${nextDate ? '<div style="font-size:11px;color:var(--text-secondary)">Next meeting: ' + nextDate + '</div>' : ''}
        </div>
        <div style="display:flex;gap:4px;flex-shrink:0">
          <button class="btn btn-sm" style="background:#fff;border:1px solid var(--border)" onclick="editMeeting('${m.id}')">Edit</button>
          <button class="btn btn-sm" style="background:#fff;color:#c92a2a;border:1px solid #ffc9c9" onclick="confirmDelete('${m.id}')">Delete</button>
        </div>
      </div>
    </div>
  `;
}

function combineDT(dateVal, timeVal) {
  if (!dateVal) return null;
  return timeVal ? dateVal + 'T' + timeVal : dateVal + 'T00:00';
}

async function createMeeting() {
  const groupId = document.getElementById('groupSelect').value;
  const meetingDate = document.getElementById('meetingDate').value;
  const meetingTime = document.getElementById('meetingTime').value;
  const notes = document.getElementById('meetingNotes').value.trim();
  const actionItems = document.getElementById('actionItems').value.trim();
  const nextMeetingDate = document.getElementById('nextMeetingDate').value;
  const nextMeetingTime = document.getElementById('nextMeetingTime').value;
  const msg = document.getElementById('formMsg');

  if (!groupId) { msg.textContent = 'Select a group'; msg.style.color = '#c92a2a'; msg.style.display = 'block'; return; }
  if (!meetingDate) { msg.textContent = 'Select meeting date'; msg.style.color = '#c92a2a'; msg.style.display = 'block'; return; }
  if (!notes) { msg.textContent = 'Enter meeting notes'; msg.style.color = '#c92a2a'; msg.style.display = 'block'; return; }

  const groupOpt = document.querySelector(`#groupSelect option[value="${groupId}"]`);
  const projectId = groupOpt ? groupOpt.dataset.project : null;
  if (!projectId) { msg.textContent = 'Group has no project'; msg.style.color = '#c92a2a'; msg.style.display = 'block'; return; }

  msg.style.display = 'none';

  try {
    await post('/api/teacher/projects/' + projectId + '/meetings', {
      meeting_date: localToISO(combineDT(meetingDate, meetingTime)),
      notes,
      action_items: actionItems || null,
      next_meeting: localToISO(combineDT(nextMeetingDate, nextMeetingTime))
    });
    document.getElementById('groupSelect').value = '';
    document.getElementById('meetingDate').value = '';
    document.getElementById('meetingTime').value = '';
    document.getElementById('meetingLabel').textContent = 'Meeting date & time';
    document.getElementById('meetingNotes').value = '';
    document.getElementById('actionItems').value = '';
    document.getElementById('nextMeetingDate').value = '';
    document.getElementById('nextMeetingTime').value = '';
    document.getElementById('nextLabel').textContent = 'Next meeting';
    msg.textContent = 'Meeting log saved!';
    msg.style.color = '#2b8a3e'; msg.style.display = 'block';
    load();
    setTimeout(() => msg.style.display = 'none', 2000);
  } catch (err) {
    msg.textContent = err.message;
    msg.style.color = '#c92a2a'; msg.style.display = 'block';
  }
}

function splitDT(val) {
  const s = toLocalInput(val);
  if (!s) return ['', ''];
  const parts = s.split('T');
  return [parts[0] || '', parts[1] || ''];
}

function editMeeting(id) {
  const m = meetingsCache.find(x => x.id === id);
  if (!m) return;

  editId = id;
  document.getElementById('editGroupSelect').value = m.group_id || '';
  const [md, mt] = splitDT(m.meeting_date);
  document.getElementById('editMeetingDate').value = md;
  document.getElementById('editMeetingTime').value = mt;
  document.getElementById('editMeetingLabel').textContent = fmtLabel(md, mt, 'Meeting date & time');
  document.getElementById('editMeetingNotes').value = m.notes;
  document.getElementById('editActionItems').value = m.action_items || '';
  const [nd, nt] = splitDT(m.next_meeting);
  document.getElementById('editNextMeetingDate').value = nd;
  document.getElementById('editNextMeetingTime').value = nt;
  document.getElementById('editNextLabel').textContent = fmtLabel(nd, nt, 'Next meeting');
  document.getElementById('editFormMsg').style.display = 'none';
  document.getElementById('editModal').style.display = 'flex';
}

function closeEditModal() {
  editId = null;
  document.getElementById('editModal').style.display = 'none';
  document.getElementById('editFormMsg').style.display = 'none';
}

async function saveEditMeeting() {
  const groupId = document.getElementById('editGroupSelect').value;
  const meetingDate = document.getElementById('editMeetingDate').value;
  const meetingTime = document.getElementById('editMeetingTime').value;
  const notes = document.getElementById('editMeetingNotes').value.trim();
  const actionItems = document.getElementById('editActionItems').value.trim();
  const nextMeetingDate = document.getElementById('editNextMeetingDate').value;
  const nextMeetingTime = document.getElementById('editNextMeetingTime').value;
  const msg = document.getElementById('editFormMsg');

  if (!groupId) { msg.textContent = 'Select a group'; msg.style.color = '#c92a2a'; msg.style.display = 'block'; return; }
  if (!meetingDate) { msg.textContent = 'Select meeting date'; msg.style.color = '#c92a2a'; msg.style.display = 'block'; return; }
  if (!notes) { msg.textContent = 'Enter meeting notes'; msg.style.color = '#c92a2a'; msg.style.display = 'block'; return; }

  msg.style.display = 'none';

  try {
    await put('/api/teacher/meetings/' + editId, {
      group_id: groupId,
      meeting_date: localToISO(combineDT(meetingDate, meetingTime)),
      notes,
      action_items: actionItems || null,
      next_meeting: localToISO(combineDT(nextMeetingDate, nextMeetingTime))
    });
    closeEditModal();
    load();
  } catch (err) {
    msg.textContent = err.message;
    msg.style.color = '#c92a2a'; msg.style.display = 'block';
  }
}

async function confirmDelete(id) {
  document.getElementById('confirmText').textContent = 'Delete this meeting log? This cannot be undone.';
  document.getElementById('confirmModal').style.display = 'flex';
  document.getElementById('confirmBtn').onclick = async function() {
    try {
      await api('/api/teacher/meetings/' + id, { method: 'DELETE' });
      closeConfirm();
      load();
    } catch (e) { alert(e.message); closeConfirm(); }
  };
}

function closeConfirm() { document.getElementById('confirmModal').style.display = 'none'; }

loadGroups();
load();
setInterval(load, 10000);
</script>
</body>
</html>
