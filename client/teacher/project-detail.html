<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Detail - KV PTA Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="main-content">
  <div id="header" class="top-header"></div>
  <div class="content-area">
    <div class="card" id="projectInfo">
      <div id="githubSection" style="display:none">
        <div id="commitList" style="margin-top:12px"></div>
      </div>
    </div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:16px">
      <div class="card" style="flex:2;min-width:300px">
        <h3 style="font-size:14px;font-weight:700;color:var(--dark-blue-800);margin-bottom:12px">Comments</h3>
        <div class="comment-thread" id="commentsList"></div>
        <div style="margin-top:12px;display:flex;gap:8px">
          <input class="form-input" id="commentInput" placeholder="Write a comment..." style="flex:1">
          <button class="btn btn-primary" onclick="addComment()">Send</button>
        </div>
      </div>
      <div style="flex:1;min-width:200px;display:flex;flex-direction:column;gap:16px">
        <div class="card">
          <h3 style="font-size:14px;font-weight:700;color:var(--dark-blue-800);margin-bottom:12px">Actions</h3>
          <button class="btn btn-primary" style="width:100%;justify-content:center;margin-bottom:8px" onclick="updateStatus('approved')">Approve</button>
          <button class="btn btn-soft" style="width:100%;justify-content:center;margin-bottom:8px" onclick="updateStatus('revision')">Request Revision</button>
          <button class="btn btn-secondary" style="width:100%;justify-content:center;color:var(--badge-red)" onclick="updateStatus('rejected')">Reject</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
const user = requireAuth();
if (user.role !== 'teacher') redirectByRole(user.role);
const projectId = localStorage.getItem('viewProjectId');
if (!projectId) window.location.href = '/teacher/dashboard.html';
renderPage('Project Detail');

async function load() {
  const project = await get(`/api/teacher/projects/${projectId}`);
  document.getElementById('projectInfo').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:8px">
      <div>
        <h2 style="font-size:18px;font-weight:700;color:var(--dark-blue-800)">${project.title}</h2>
        <p style="font-size:13px;color:var(--gray-500)">Group: ${project.group_name}</p>
        <p style="font-size:12px;color:var(--gray-400)">${project.students && project.students.length ? project.students.map(s => s.full_name).join(', ') : ''}</p>
      </div>
      <div><span class="badge ${project.status === 'approved' ? 'badge-green' : project.status === 'rejected' ? 'badge-red' : project.status === 'submitted' ? 'badge-yellow' : 'badge-gray'}">${project.status}</span></div>
    </div>
    <div style="margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div><div style="font-size:12px;font-weight:600;color:var(--gray-500);margin-bottom:2px">Objective</div><div style="font-size:14px">${project.objective}</div></div>
      <div><div style="font-size:12px;font-weight:600;color:var(--gray-500);margin-bottom:2px">Purpose</div><div style="font-size:14px">${project.purpose}</div></div>
      <div style="grid-column:1/-1"><div style="font-size:12px;font-weight:600;color:var(--gray-500);margin-bottom:2px">Scope</div><div style="font-size:14px">${project.scope}</div></div>
    </div>
    <div id="githubSection" style="display:none"></div>
  `;
  loadComments();
}

async function loadComments() {
  const comments = await get(`/api/teacher/projects/${projectId}/comments`);
  const container = document.getElementById('commentsList');
  if (comments.length === 0) {
    container.innerHTML = '<div class="empty-state" style="padding:24px"><p>No comments yet</p></div>';
  } else {
    container.innerHTML = comments.map(c => `
      <div class="comment"><div class="comment-header"><span class="comment-author">${c.author_name}</span><span class="badge ${c.author_role === 'teacher' ? 'badge-blue' : 'badge-gray'}" style="font-size:10px">${c.author_role}</span><span class="comment-time">${new Date(c.created_at).toLocaleString()}</span></div><div class="comment-content">${c.content}</div></div>
    `).join('');
  }
}

async function addComment() {
  const input = document.getElementById('commentInput');
  if (!input.value.trim()) return;
  try {
    await post(`/api/teacher/projects/${projectId}/comments`, { content: input.value });
    input.value = '';
    loadComments();
  } catch (e) { alert(e.message); }
}

async function updateStatus(status) {
  try {
    await patch(`/api/teacher/projects/${projectId}/status`, { status });
    load();
  } catch (e) { alert(e.message); }
}

async function loadGitHubCommits() {
  const section = document.getElementById('githubSection');
  if (!section) return;
  try {
    const summary = await get('/api/github/repo-summary/' + projectId);
    if (!summary.linked) { section.style.display = 'none'; return; }
    section.style.display = 'block';

    section.innerHTML = '<div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--gray-200)"><div style="display:flex;align-items:center;gap:6px;margin-bottom:10px"><svg width="16" height="16" viewBox="0 0 24 24" fill="var(--dark-blue-600)"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg><span style="font-size:13px;font-weight:600;color:var(--dark-blue-800)">GitHub Commits</span><a href="https://github.com/' + summary.fullName + '" target="_blank" style="font-size:11px;color:var(--dark-blue-600);text-decoration:none;margin-left:auto">' + summary.fullName + '</a></div><div id="commitList"></div></div>';

    const commits = await get('/api/github/commits/' + projectId + '?limit=20');
    const list = document.getElementById('commitList');

    if (commits.length === 0) {
      list.innerHTML = '<div style="text-align:center;padding:12px;color:var(--gray-400);font-size:12px">No commits found</div>';
      return;
    }

    for (const c of commits) {
      const commitEl = document.createElement('div');
      commitEl.style.cssText = 'padding:6px 0;border-bottom:1px solid var(--gray-100);font-size:12px';
      commitEl.innerHTML = `
        <div style="display:flex;align-items:flex-start;gap:6px">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--gray-400)" stroke-width="2" style="margin-top:2px;flex-shrink:0"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          <div style="flex:1">
            <a href="${c.url}" target="_blank" style="color:var(--dark-blue-700);text-decoration:none;font-weight:500">${c.message.split('\n')[0]}</a>
            <div style="font-size:10px;color:var(--gray-400);margin-top:1px">
              <span>${c.author}</span>
              <span>&middot;</span>
              <span>${timeAgo(c.date)}</span>
              <span>&middot;</span>
              <span style="font-family:monospace">${c.sha.slice(0,7)}</span>
              <button class="btn btn-sm" style="font-size:10px;padding:1px 6px;margin-left:6px" onclick="toggleCommitComment('${c.sha}', this)">Comment</button>
            </div>
            <div id="commitComments_${c.sha}" style="margin-top:3px"></div>
            <div id="commitCommentForm_${c.sha}" style="display:none;margin-top:4px">
              <div style="display:flex;gap:4px">
                <input class="form-input" id="commentInput_${c.sha}" placeholder="Write feedback on this commit..." style="flex:1;font-size:11px;padding:4px 8px">
                <button class="btn btn-primary btn-sm" style="font-size:10px" onclick="addCommitComment('${c.sha}')">Send</button>
              </div>
            </div>
          </div>
        </div>
      `;
      list.appendChild(commitEl);
      loadCommitComments(c.sha);
    }
  } catch {
    section.style.display = 'none';
  }
}

async function loadCommitComments(sha) {
  try {
    const comments = await get('/api/github/commits/' + projectId + '/' + sha + '/comments');
    const container = document.getElementById('commitComments_' + sha);
    if (!comments.length) return;
    container.innerHTML = comments.map(c => `
      <div style="padding:6px 8px;margin-top:4px;background:var(--gray-50);border-radius:4px;font-size:12px">
        <div style="display:flex;align-items:center;gap:4px;margin-bottom:2px">
          ${c.authorAvatar ? '<img src="' + c.authorAvatar + '" style="width:16px;height:16px;border-radius:50%">' : ''}
          <strong style="font-size:11px;color:var(--dark-blue-700)">${c.author}</strong>
          <span style="font-size:10px;color:var(--gray-400)">${timeAgo(c.createdAt)}</span>
        </div>
        <div style="color:var(--gray-600)">${c.body.replace(/\n— Comment from KV PTA Management$/, '')}</div>
      </div>
    `).join('');
  } catch {}
}

function toggleCommitComment(sha, btn) {
  const form = document.getElementById('commitCommentForm_' + sha);
  form.style.display = form.style.display === 'none' ? 'block' : 'none';
  if (form.style.display === 'block') document.getElementById('commentInput_' + sha).focus();
}

async function addCommitComment(sha) {
  const input = document.getElementById('commentInput_' + sha);
  if (!input.value.trim()) return;
  try {
    await post('/api/github/commits/' + projectId + '/' + sha + '/comments', { body: input.value });
    input.value = '';
    document.getElementById('commitCommentForm_' + sha).style.display = 'none';
    loadCommitComments(sha);
  } catch (e) { alert(e.message); }
}

load();
loadGitHubCommits();
setInterval(() => { load(); loadGitHubCommits(); }, 10000);
</script>
</body>
</html>
