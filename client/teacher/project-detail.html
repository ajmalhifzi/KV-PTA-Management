<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Detail - KV PTA Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="main-content">
  <div id="header" class="top-header"></div>
  <div class="content-area">
    <div class="card" style="margin-bottom:16px" id="projectInfo"></div>
    <div style="display:flex;gap:16px;flex-wrap:wrap">
      <div class="card" style="flex:2;min-width:300px">
        <h3 style="font-size:14px;font-weight:700;color:var(--dark-blue-800);margin-bottom:12px">Comments</h3>
        <div class="comment-thread" id="commentsList"></div>
        <div style="margin-top:12px;display:flex;gap:8px">
          <input class="form-input" id="commentInput" placeholder="Write a comment..." style="flex:1">
          <button class="btn btn-primary" onclick="addComment()">Send</button>
        </div>
      </div>
      <div class="card" style="flex:1;min-width:200px">
        <h3 style="font-size:14px;font-weight:700;color:var(--dark-blue-800);margin-bottom:12px">Actions</h3>
        <button class="btn btn-primary" style="width:100%;justify-content:center;margin-bottom:8px" onclick="updateStatus('approved')">Approve</button>
        <button class="btn btn-soft" style="width:100%;justify-content:center;margin-bottom:8px" onclick="updateStatus('revision')">Request Revision</button>
        <button class="btn btn-secondary" style="width:100%;justify-content:center;color:var(--badge-red)" onclick="updateStatus('rejected')">Reject</button>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
const user = requireAuth();
if (user.role !== 'teacher') redirectByRole(user.role);
const projectId = localStorage.getItem('viewProjectId');
if (!projectId) window.location.href = '/teacher/dashboard.html';
renderPage('Project Detail');

async function load() {
  const project = await get(`/api/teacher/projects/${projectId}`);
  document.getElementById('projectInfo').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:8px">
      <div><h2 style="font-size:18px;font-weight:700;color:var(--dark-blue-800)">${project.title}</h2><p style="font-size:13px;color:var(--gray-500)">by ${project.student_name} (${project.student_email})</p></div>
      <div><span class="badge ${project.status === 'approved' ? 'badge-green' : project.status === 'rejected' ? 'badge-red' : project.status === 'submitted' ? 'badge-yellow' : 'badge-gray'}">${project.status}</span></div>
    </div>
    <div style="margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div><div style="font-size:12px;font-weight:600;color:var(--gray-500);margin-bottom:2px">Objective</div><div style="font-size:14px">${project.objective}</div></div>
      <div><div style="font-size:12px;font-weight:600;color:var(--gray-500);margin-bottom:2px">Purpose</div><div style="font-size:14px">${project.purpose}</div></div>
      <div style="grid-column:1/-1"><div style="font-size:12px;font-weight:600;color:var(--gray-500);margin-bottom:2px">Scope</div><div style="font-size:14px">${project.scope}</div></div>
    </div>
  `;
  loadComments();
}

async function loadComments() {
  const comments = await get(`/api/teacher/projects/${projectId}/comments`);
  const container = document.getElementById('commentsList');
  if (comments.length === 0) {
    container.innerHTML = '<div class="empty-state" style="padding:24px"><p>No comments yet</p></div>';
  } else {
    container.innerHTML = comments.map(c => `
      <div class="comment"><div class="comment-header"><span class="comment-author">${c.author_name}</span><span class="badge ${c.author_role === 'teacher' ? 'badge-blue' : 'badge-gray'}" style="font-size:10px">${c.author_role}</span><span class="comment-time">${new Date(c.created_at).toLocaleString()}</span></div><div class="comment-content">${c.content}</div></div>
    `).join('');
  }
}

async function addComment() {
  const input = document.getElementById('commentInput');
  if (!input.value.trim()) return;
  try {
    await post(`/api/teacher/projects/${projectId}/comments`, { content: input.value });
    input.value = '';
    loadComments();
  } catch (e) { alert(e.message); }
}

async function updateStatus(status) {
  try {
    await patch(`/api/teacher/projects/${projectId}/status`, { status });
    location.reload();
  } catch (e) { alert(e.message); }
}

load();
</script>
</body>
</html>
