<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resources - KV PTA Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="main-content">
  <div id="header" class="top-header"></div>
  <div class="content-area">

    <div class="card" style="padding:0">
      <div style="padding:16px 20px;border-bottom:1px solid var(--gray-200);font-weight:600;font-size:14px;color:var(--dark-blue-800)">Resources from Teacher</div>
      <div class="table-container"><table><thead><tr><th>Title</th><th>Teacher</th><th>Type</th><th>Uploaded</th></tr></thead><tbody id="resourcesList"></tbody></table></div>
    </div>

  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
const user = requireAuth();
if (user.role !== 'student') redirectByRole(user.role);
renderPage('Resources');

async function load() {
  const resources = await get('/api/student/resources');
  const tbody = document.getElementById('resourcesList');
  if (resources.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty-state" style="padding:32px"><p>No resources from your teacher yet</p></td></tr>';
  } else {
    tbody.innerHTML = resources.map(r => `
      <tr>
        <td><a href="/api/files/resources/${r.id}" target="_blank" style="color:var(--dark-blue-600);text-decoration:none;font-weight:600">${r.title}</a></td>
        <td>${r.teacher_name}</td>
        <td><span class="badge badge-blue">${r.file_type || '-'}</span></td>
        <td style="color:var(--gray-400);font-size:13px">${new Date(r.created_at).toLocaleDateString()}</td>
      </tr>
    `).join('');
  }
}

load();
setInterval(load, 5000);
</script>
</body>
</html>
