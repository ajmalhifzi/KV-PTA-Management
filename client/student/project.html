<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Project - KV PTA Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css">
<style>
  textarea.form-input { resize:vertical }
  .field-label { display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px }
  .msg-success { font-size:13px;color:#2b8a3e;margin-bottom:8px }
  .msg-error { font-size:13px;color:#c92a2a;margin-bottom:8px }
  .photo-day-label { font-size:11px;font-weight:600;color:var(--text-secondary);text-align:center;margin-top:8px }
  .photo-lightbox { position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s }
  .photo-lightbox.open { opacity:1;pointer-events:all }
  .photo-lightbox img { max-width:min(92vw,1100px);max-height:80vh;object-fit:contain;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5) }
  .photo-lightbox-stage { display:flex;flex-direction:column;align-items:center;gap:12px }
  .photo-lightbox-caption { font-size:14px;color:#e9ecef;text-align:center;max-width:min(92vw,1100px) }
  .photo-lightbox-counter { font-size:12px;color:#adb5bd }
  .photo-lightbox-close { position:absolute;top:18px;right:22px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:24px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center }
  .photo-lightbox-close:hover { background:rgba(255,255,255,.25) }
  .photo-lightbox-nav { position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:30px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s }
  .photo-lightbox-nav:hover { background:rgba(255,255,255,.25) }
  .photo-lightbox-nav.prev { left:20px }
  .photo-lightbox-nav.next { right:20px }
  .photo-lightbox-nav.hidden { display:none }
</style>
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="main-content">
  <div id="header" class="top-header"></div>
  <div class="content-area">

    <div id="projectView" style="display:none">
      <div style="margin-bottom:12px">
        <a href="/student/projects.html" style="font-size:13px;color:var(--primary);text-decoration:none;display:inline-flex;align-items:center;gap:4px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          Back to Projects
        </a>
      </div>
      <div id="projectInfo" class="card" style="margin-bottom:16px">
        <div id="projectInfoHeader"></div>
        <div id="projectInfoBody" style="margin-top:16px"></div>
        <div id="projectInfoActions" style="margin-top:16px;display:flex;gap:8px;align-items:center"></div>
      </div>

      <div style="display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start">
        <div id="githubCard" class="card" style="display:none">
          <div id="githubCardContent"></div>
        </div>
        <div>
          <div class="card" style="margin-bottom:16px;padding:16px">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
              <div style="font-size:13px;font-weight:600;color:var(--text-muted)">Photo Slider</div>
              <span id="photoCount" class="badge badge-gray" style="font-size:10px;display:none"></span>
            </div>
            <div id="photoSlider"></div>
          </div>
          <div class="card" style="padding:16px">
            <div style="font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:8px">Comment & Chat</div>
            <div id="chatList" style="font-size:13px;color:var(--text-muted);max-height:300px;overflow-y:auto;margin-bottom:10px">
              <p>No messages yet.</p>
            </div>
            <div style="display:flex;gap:6px">
              <input class="form-input" id="chatInput" placeholder="Type a message..." style="flex:1;font-size:12px">
              <button class="btn btn-primary btn-sm" onclick="addChatComment()" style="font-size:12px;white-space:nowrap">Send</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="noProject" style="display:none">
      <div class="card" style="max-width:600px;text-align:center;padding:48px">
        <p style="font-size:16px;font-weight:600;color:var(--text-primary);margin-bottom:8px">Project Not Found</p>
        <p style="font-size:13px;color:var(--text-secondary);margin-bottom:20px">This project could not be loaded.</p>
        <button class="btn btn-primary" onclick="window.location.href='/student/projects.html'">Back to Projects</button>
      </div>
    </div>

    <div id="linkRepoModal" class="modal-overlay">
      <div class="modal" style="max-width:500px;max-height:80vh;overflow-y:auto">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <h3>Select Repository</h3>
          <button onclick="closeLinkRepoModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted)">&times;</button>
        </div>
        <div id="repoList" style="max-height:400px;overflow-y:auto">
          <div style="text-align:center;padding:24px;color:var(--text-muted);font-size:13px">Loading repositories...</div>
        </div>
        <div style="margin-top:12px;font-size:12px;color:var(--text-muted)">Only showing your 100 most recently updated repositories.</div>
      </div>
    </div>

  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
const user = requireAuth();
if (user.role !== 'student') redirectByRole(user.role);
renderPage('My Project');

let currentProjectId = null;

function timeAgo(val) {
  const diff = Date.now() - new Date(val).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs / 24);
  if (days < 7) return days + 'd ago';
  return new Date(val).toLocaleDateString('en-MY', { day: 'numeric', month: 'short' });
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function load() {
  const urlParams = new URLSearchParams(window.location.search);
  const projectId = urlParams.get('project');
  if (!projectId) {
    window.location.href = '/student/projects.html';
    return;
  }
  currentProjectId = projectId;

  try {
    const data = await get('/api/student/projects/' + projectId);
    document.getElementById('noProject').style.display = 'none';
    document.getElementById('projectView').style.display = 'block';

    renderProjectInfo(data);
    renderGitHub(data);
    loadComments();
    loadPhotoSlider();
  } catch {
    document.getElementById('projectView').style.display = 'none';
    document.getElementById('noProject').style.display = 'block';
  }
}

function renderProjectInfo(data) {
  const status = data.status || 'draft';
  const badgeClass = status === 'approved' ? 'badge-green' : status === 'rejected' ? 'badge-red' : status === 'submitted' ? 'badge-yellow' : 'badge-gray';
  const students = data.students && data.students.length ? data.students.map(s => escapeHtml(s.full_name)).join(', ') : '';

  document.getElementById('projectInfoHeader').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:8px">
      <div>
        <h2 style="font-size:18px;font-weight:700;color:var(--text-primary)">${escapeHtml(data.title || '(No title)')}</h2>
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:13px;color:var(--text-secondary)">
          <span><strong style="color:var(--primary)">Group:</strong> ${escapeHtml(data.group_name)}</span>
          <span><strong style="color:var(--primary)">Teacher:</strong> ${escapeHtml(data.teacher_name)} (${escapeHtml(data.teacher_email)})</span>
          ${students ? '<span><strong style="color:var(--primary)">Students:</strong> ' + students + '</span>' : ''}
        </div>
      </div>
      <span class="badge ${badgeClass}" style="font-size:12px">${status}</span>
    </div>
  `;

  document.getElementById('projectInfoBody').innerHTML = `
    <div class="form-group">
      <label class="field-label">Project Title</label>
      <input class="form-input" id="editTitle" value="${escapeHtml(data.title || '')}">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group">
        <label class="field-label">Objective</label>
        <textarea class="form-input" id="editObjective" rows="2">${escapeHtml(data.objective || '')}</textarea>
      </div>
      <div class="form-group">
        <label class="field-label">Purpose</label>
        <textarea class="form-input" id="editPurpose" rows="2">${escapeHtml(data.purpose || '')}</textarea>
      </div>
    </div>
    <div class="form-group">
      <label class="field-label">Scope</label>
      <textarea class="form-input" id="editScope" rows="2">${escapeHtml(data.scope || '')}</textarea>
    </div>
    <div id="editMsg" style="display:none"></div>
  `;

  document.getElementById('projectInfoActions').innerHTML = `
    <button class="btn btn-primary btn-sm" onclick="saveProject()">Save Changes</button>
    ${status === 'draft' ? '<button class="btn btn-soft btn-sm" onclick="submitProject()">Submit for Review</button>' : ''}
  `;
}

async function saveProject() {
  const msg = document.getElementById('editMsg');
  msg.style.display = 'none';
  try {
    await put('/api/student/projects/' + currentProjectId, {
      title: document.getElementById('editTitle').value,
      objective: document.getElementById('editObjective').value,
      purpose: document.getElementById('editPurpose').value,
      scope: document.getElementById('editScope').value
    });
    msg.className = 'msg-success';
    msg.textContent = 'Project saved successfully.';
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', 3000);
  } catch (e) {
    msg.className = 'msg-error';
    msg.textContent = e.message;
    msg.style.display = 'block';
  }
}

async function submitProject() {
  try {
    await post('/api/student/projects/' + currentProjectId + '/submit');
    load();
  } catch (e) { alert(e.message); }
}

/* Photo Slider */

let photoIndex = 0;
let photos = [];

async function loadPhotoSlider() {
  try {
    const all = await get('/api/student/project-photos?project=' + currentProjectId);
    const todayKey = localDayKey(new Date());
    if (all.some(p => localDayKey(p.uploaded_at) === todayKey)) {
      photos = all.filter(p => localDayKey(p.uploaded_at) === todayKey);
    } else {
      photos = all.length ? all.filter(p => localDayKey(p.uploaded_at) === localDayKey(all.reduce((a, b) => new Date(a.uploaded_at) > new Date(b.uploaded_at) ? a : b).uploaded_at)) : [];
    }
    photoIndex = Math.max(0, photos.length - 1);
    renderPhotoSlider();
  } catch {
    document.getElementById('photoSlider').innerHTML =
      '<p style="font-size:12px;color:var(--text-muted);text-align:center;padding:8px">Could not load photos.</p>';
  }
}

function localDayKey(d) {
  const t = new Date(d);
  return t.getFullYear() + '-' + (t.getMonth() + 1) + '-' + t.getDate();
}

function photoDayLabel(d) {
  const t = new Date(d);
  const today = new Date();
  const startOfDay = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((startOfDay(today) - startOfDay(t)) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return t.toLocaleDateString('en-MY', { day: 'numeric', month: 'short', year: 'numeric' });
}

function renderPhotoSlider() {
  const container = document.getElementById('photoSlider');
  if (!container) return;
  const count = document.getElementById('photoCount');
  if (count) {
    count.textContent = photos.length ? photos.length + (photos.length > 1 ? ' photos' : ' photo') : '';
    count.style.display = photos.length ? 'inline-block' : 'none';
  }
  if (!photos.length) {
    container.innerHTML =
      '<p style="font-size:12px;color:var(--text-muted);text-align:center;margin-bottom:12px">No photos yet. Showcase your project progress.</p>' +
      '<div style="text-align:center"><button class="btn btn-primary btn-sm" onclick="openPhotoPicker()">Upload Photo</button></div>' +
      '<input type="file" id="photoFileInput" accept="image/*" style="display:none" onchange="uploadPhoto()">';
    return;
  }

  const photo = photos[Math.min(photoIndex, photos.length - 1)];
  const canDelete = photo.uploader_id === user.id;
  const photoKey = localDayKey(photo.uploaded_at);
  const dayCount = photos.filter(p => localDayKey(p.uploaded_at) === photoKey).length;
  const dayLabel = photoDayLabel(photo.uploaded_at);
  container.innerHTML = `
    <div style="position:relative;border-radius:8px;overflow:hidden;background:var(--bg-card);border:1px solid var(--border-light)">
      <div style="width:100%;height:190px;display:flex;align-items:center;justify-content:center;background:#f5f7fb;overflow:hidden">
        <img src="/api/files/photos/${photo.id}" alt="${escapeHtml(photo.caption || 'project photo')}"
             title="Click to enlarge" onclick="openLightbox()" style="max-width:100%;max-height:190px;object-fit:contain;cursor:pointer" onerror="this.parentElement.innerHTML='<p style=&quot;font-size:12px;color:var(--text-muted)&quot;>Photo unavailable</p>'">
      </div>
      ${photos.length > 1 ? `
      <button onclick="prevPhoto()" style="position:absolute;left:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:14px;color:var(--text-primary);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.15)">&lsaquo;</button>
      <button onclick="nextPhoto()" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:14px;color:var(--text-primary);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.15)">&rsaquo;</button>` : ''}
      ${canDelete ? `
      <button onclick="deletePhoto('${photo.id}')" title="Delete photo" style="position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(201,42,42,.9);color:#fff;cursor:pointer;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center">&times;</button>` : ''}
    </div>
    <div style="margin-top:8px;font-size:12px;color:var(--text-secondary);text-align:center;min-height:16px">${escapeHtml(photo.caption || '')}</div>
    <div class="photo-day-label">${dayLabel} &middot; ${dayCount} photo${dayCount > 1 ? 's' : ''}</div>
    ${photos.length > 1 ? `
    <div style="display:flex;justify-content:center;gap:6px;margin-top:8px">
      ${photos.map((p, i) => '<button onclick="goToPhoto(' + i + ')" style="width:8px;height:8px;border-radius:50%;border:none;cursor:pointer;padding:0;background:' + (i === photoIndex ? 'var(--primary)' : 'var(--border)') + '"></button>').join('')}
    </div>` : ''}
    <div style="text-align:center;margin-top:10px">
      <button class="btn btn-primary btn-sm" onclick="openPhotoPicker()">Upload Photo</button>
      <input type="file" id="photoFileInput" accept="image/*" style="display:none" onchange="uploadPhoto()">
    </div>
  `;
}

function openPhotoPicker() {
  document.getElementById('photoFileInput').click();
}

function prevPhoto() {
  photoIndex = (photoIndex - 1 + photos.length) % photos.length;
  renderPhotoSlider();
}

function nextPhoto() {
  photoIndex = (photoIndex + 1) % photos.length;
  renderPhotoSlider();
}

function goToPhoto(i) {
  photoIndex = i;
  renderPhotoSlider();
}

function openLightbox() {
  const lb = document.getElementById('photoLightbox');
  if (!lb || !photos.length) return;
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
  renderLightbox();
}

function closeLightbox() {
  const lb = document.getElementById('photoLightbox');
  if (!lb) return;
  lb.classList.remove('open');
  document.body.style.overflow = '';
}

function renderLightbox() {
  const lb = document.getElementById('photoLightbox');
  if (!lb) return;
  const photo = photos[Math.min(photoIndex, photos.length - 1)];
  document.getElementById('lightboxImg').src = '/api/files/photos/' + photo.id;
  document.getElementById('lightboxCaption').textContent = photo.caption || '';
  document.getElementById('lightboxCounter').textContent = (photoIndex + 1) + ' / ' + photos.length;
  const hasNav = photos.length > 1;
  lb.querySelector('.photo-lightbox-nav.prev').classList.toggle('hidden', !hasNav);
  lb.querySelector('.photo-lightbox-nav.next').classList.toggle('hidden', !hasNav);
}

function lightboxPrev() {
  if (!photos.length) return;
  photoIndex = (photoIndex - 1 + photos.length) % photos.length;
  renderPhotoSlider();
  renderLightbox();
}

function lightboxNext() {
  if (!photos.length) return;
  photoIndex = (photoIndex + 1) % photos.length;
  renderPhotoSlider();
  renderLightbox();
}

async function uploadPhoto() {
  const input = document.getElementById('photoFileInput');
  if (!input.files || !input.files[0]) return;
  const file = input.files[0];
  if (file.size > 10 * 1024 * 1024) {
    alert('Photo too large. Max 10MB.');
    input.value = '';
    return;
  }
  const caption = prompt('Add a caption for this photo (optional):') || '';
  const reader = new FileReader();
  reader.onload = async function(e) {
    try {
      await post('/api/student/project-photos', {
        project: currentProjectId,
        caption: caption,
        file_data: e.target.result.split(',')[1],
        file_type: file.type || 'image/jpeg'
      });
      input.value = '';
      await loadPhotoSlider();
      photoIndex = photos.length - 1;
      renderPhotoSlider();
    } catch (err) { alert(err.message); }
  };
  reader.readAsDataURL(file);
}

async function deletePhoto(photoId) {
  if (!confirm('Delete this photo?')) return;
  try {
    await del('/api/student/project-photos/' + photoId);
    photos = photos.filter(p => p.id !== photoId);
    if (photoIndex >= photos.length) photoIndex = 0;
    renderPhotoSlider();
  } catch (e) { alert(e.message); }
}

/* GitHub */

function renderGitHub(data) {
  const card = document.getElementById('githubCard');
  if (!data.id) { card.style.display = 'none'; return; }
  card.style.display = 'block';

  const content = document.getElementById('githubCardContent');
  content.innerHTML = `
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--primary)"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
      <span style="font-size:14px;font-weight:600;color:var(--text-primary)">GitHub Repository</span>
      <span id="githubBadge" class="badge badge-gray" style="font-size:10px;display:none"></span>
    </div>
    <div id="githubContent">
      <div style="text-align:center;padding:12px;color:var(--text-muted);font-size:12px">Loading GitHub status...</div>
    </div>
  `;

  if (data.github_repo_url) {
    loadGitHubData(data);
  } else {
    checkGitHubStatus(data);
  }
}

async function checkGitHubStatus(data) {
  const container = document.getElementById('githubContent');
  try {
    const statusRes = await get('/api/github/status');
    if (statusRes.connected) {
      container.innerHTML = `
        <div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px">Connected as <strong style="color:var(--primary)">${statusRes.github_username}</strong></div>
        <button class="btn btn-primary btn-sm" onclick="showLinkRepoModal()" style="font-size:12px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          Link Repository
        </button>
      `;
    } else {
      container.innerHTML = `
        <p style="font-size:13px;color:var(--text-secondary);margin-bottom:8px">Connect your GitHub account to link a repository to this project.</p>
        <button class="btn btn-primary btn-sm" onclick="connectGitHub()" style="font-size:12px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="margin-right:4px"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
          Connect GitHub
        </button>
      `;
    }
  } catch {
    container.innerHTML = '<div style="text-align:center;padding:12px;color:var(--text-muted);font-size:12px">Failed to check GitHub status.</div>';
  }
}

async function loadGitHubData(data) {
  const content = document.getElementById('githubContent');
  const badge = document.getElementById('githubBadge');
  try {
    const summary = await get('/api/github/my-repo-summary?project=' + currentProjectId);
    const repoFullName = data.github_repo_url.replace('https://github.com/', '');
    badge.textContent = 'Repo Linked';
    badge.className = 'badge badge-green';
    badge.style.display = 'inline-block';

    let extraInfo = '';
    if (summary.linked && summary.lastCommit) {
      extraInfo += '<div style="margin-top:4px;font-size:12px;color:var(--text-muted)">Last commit: ' + new Date(summary.lastCommit.date).toLocaleString() + ' by ' + summary.lastCommit.author + '</div>';
    }
    if (summary.language) {
      extraInfo += ' <span class="badge badge-blue" style="font-size:9px">' + summary.language + '</span>';
    }
    if (summary.private) {
      extraInfo += ' <span class="badge badge-gray" style="font-size:9px">Private</span>';
    }

    content.innerHTML = `
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <a href="${data.github_repo_url}" target="_blank" style="font-size:14px;font-weight:600;color:var(--primary);text-decoration:none;display:flex;align-items:center;gap:4px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          ${repoFullName}
        </a>
        ${extraInfo}
      </div>
      <div id="commitArea" style="margin-top:10px"></div>
      <div style="margin-top:8px">
        <button class="btn btn-secondary btn-sm" onclick="unlinkRepo()" style="color:var(--red);font-size:11px">Unlink</button>
      </div>
    `;
    loadStudentCommits();
  } catch {
    content.innerHTML = '<div style="text-align:center;padding:12px;color:var(--text-muted);font-size:12px">Failed to load repo data.</div>';
  }
}

async function loadStudentCommits() {
  try {
    const commits = await get('/api/github/my-commits?project=' + currentProjectId + '&limit=15');
    const area = document.getElementById('commitArea');
    if (!area) return;
    if (!commits.length) { area.innerHTML = ''; return; }
    area.innerHTML = '<div style="font-size:13px;font-weight:600;color:var(--primary);margin-bottom:6px">Recent Commits & Feedback</div>' +
      '<div style="max-height:250px;overflow-y:auto">' +
      commits.map(c => {
        const hasComments = c.comments && c.comments.length > 0;
        return '<div style="padding:7px 0;border-bottom:1px solid var(--border-light);font-size:13px">' +
          '<div style="display:flex;align-items:flex-start;gap:5px">' +
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" style="margin-top:3px;flex-shrink:0"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>' +
            '<div style="flex:1">' +
              '<a href="' + c.url + '" target="_blank" style="color:var(--primary);text-decoration:none;font-weight:500">' + c.message.split('\n')[0] + '</a>' +
              '<div style="font-size:11px;color:var(--text-muted);margin-top:1px">' +
                '<span>' + c.author + '</span> <span>&middot;</span> <span>' + timeAgo(c.date) + '</span> <span>&middot;</span> <span style="font-family:monospace">' + c.sha.slice(0,7) + '</span>' +
                (hasComments ? ' <span style="color:var(--primary)">&middot; ' + c.comments.length + ' comment(s)</span>' : '') +
              '</div>' +
              (hasComments ? '<div style="margin-top:4px">' + c.comments.map(cmt =>
                '<div style="padding:5px 8px;margin-top:3px;background:var(--primary-lighter);border-radius:4px;font-size:12px">' +
                  '<strong style="color:var(--primary)">' + cmt.author + '</strong> ' +
                  '<span style="color:var(--text-secondary)">' + cmt.body + '</span>' +
                '</div>'
              ).join('') + '</div>' : '') +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('') +
      '</div>';
  } catch {}
}

function connectGitHub() {
  const token = localStorage.getItem('token');
  window.location.href = '/api/github/login?token=' + encodeURIComponent(token);
}

function showLinkRepoModal() {
  document.getElementById('linkRepoModal').classList.add('open');
  const repoList = document.getElementById('repoList');
  repoList.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text-muted);font-size:13px">Loading repositories...</div>';
  get('/api/github/user-repos').then(repos => {
    if (repos.length === 0) {
      repoList.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text-muted);font-size:13px">No repositories found. Create one on GitHub first.</div>';
      return;
    }
    repoList.innerHTML = repos.map(r => `
      <div class="repo-item" onclick="linkRepo('${r.name}')" style="padding:10px 12px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;cursor:pointer;transition:background 0.15s" onmouseenter="this.style.background='var(--primary-lighter)'" onmouseleave="this.style.background=''">
        <div style="display:flex;align-items:center;gap:6px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="${r.private ? 'var(--yellow)' : 'var(--text-muted)'}"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
          <strong style="font-size:14px;color:var(--primary)">${r.name}</strong>
        </div>
        ${r.description ? '<div style="font-size:12px;color:var(--text-secondary);margin-top:4px;margin-left:22px">' + r.description + '</div>' : ''}
      </div>
    `).join('');
  }).catch(() => {
    repoList.innerHTML = '<div style="text-align:center;padding:24px;color:var(--red);font-size:13px">Failed to load repositories.</div>';
  });
}

function closeLinkRepoModal() {
  document.getElementById('linkRepoModal').classList.remove('open');
}

async function linkRepo(repoFullName) {
  try {
    await post('/api/github/link-repo', { repoFullName, project: currentProjectId });
    closeLinkRepoModal();
    location.reload();
  } catch (e) { alert(e.message); }
}

async function unlinkRepo() {
  if (!confirm('Unlink this repository from the project?')) return;
  try {
    await post('/api/github/unlink-repo', { project: currentProjectId });
    location.reload();
  } catch (e) { alert(e.message); }
}

/* Comment & Chat */

async function loadComments() {
  try {
    const comments = await get('/api/student/comments?project=' + currentProjectId);
    const list = document.getElementById('chatList');
    if (!comments.length) {
      list.innerHTML = '<p style="color:var(--text-muted);font-size:13px">No messages yet.</p>';
    } else {
      list.innerHTML = comments.map(c =>
        '<div style="padding:6px 8px;margin-bottom:4px;background:var(--bg-card);border:1px solid var(--border-light);border-radius:6px;font-size:13px">' +
          '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">' +
            '<strong style="color:var(--primary);font-size:12px">' + c.author_name + '</strong>' +
            '<span style="font-size:10px;color:var(--text-muted)">' + new Date(c.created_at).toLocaleString() + '</span>' +
          '</div>' +
          '<div style="color:var(--text-secondary)">' + escapeHtml(c.content) + '</div>' +
        '</div>'
      ).join('');
      list.scrollTop = list.scrollHeight;
    }
  } catch { list.innerHTML = '<p style="color:var(--text-muted);font-size:13px">Could not load messages.</p>'; }
}

async function addChatComment() {
  const input = document.getElementById('chatInput');
  if (!input.value.trim()) return;
  try {
    await post('/api/student/comments', { content: input.value, project: currentProjectId });
    input.value = '';
    loadComments();
  } catch (e) { alert(e.message); }
}

/* Init */
load();
setInterval(loadComments, 5000);
</script>

<div id="photoLightbox" class="photo-lightbox" onclick="if(event.target===this)closeLightbox()">
  <button class="photo-lightbox-close" onclick="closeLightbox()" title="Close">&times;</button>
  <button class="photo-lightbox-nav prev" onclick="lightboxPrev()" title="Previous">&lsaquo;</button>
  <div class="photo-lightbox-stage">
    <img id="lightboxImg" src="" alt="">
    <div id="lightboxCaption" class="photo-lightbox-caption"></div>
    <div id="lightboxCounter" class="photo-lightbox-counter"></div>
  </div>
  <button class="photo-lightbox-nav next" onclick="lightboxNext()" title="Next">&rsaquo;</button>
</div>

<script>
document.addEventListener('keydown', function(e) {
  const lb = document.getElementById('photoLightbox');
  if (!lb || !lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowLeft') lightboxPrev();
  else if (e.key === 'ArrowRight') lightboxNext();
});
</script>
</body>
</html>
