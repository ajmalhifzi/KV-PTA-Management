<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comments - KV PTA Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="main-content">
  <div id="header" class="top-header"></div>
  <div class="content-area">
    <div class="card" style="margin-bottom:16px">
      <h3 style="font-size:14px;font-weight:700;color:var(--dark-blue-800);margin-bottom:12px">Discussion with Teacher</h3>
      <div class="comment-thread" id="commentsList"></div>
      <div style="margin-top:12px;display:flex;gap:8px">
        <input class="form-input" id="commentInput" placeholder="Reply to teacher..." style="flex:1">
        <button class="btn btn-primary" onclick="addComment()">Send</button>
      </div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
const user = requireAuth();
if (user.role !== 'student') redirectByRole(user.role);
renderPage('Comments');

async function load() {
  const comments = await get('/api/student/comments');
  const container = document.getElementById('commentsList');
  if (comments.length === 0) {
    container.innerHTML = '<div class="empty-state" style="padding:24px"><p>No comments yet. Your teacher will leave feedback here.</p></div>';
  } else {
    container.innerHTML = comments.map(c => `
      <div class="comment"><div class="comment-header"><span class="comment-author">${c.author_name}</span><span class="badge ${c.author_role === 'teacher' ? 'badge-blue' : 'badge-gray'}" style="font-size:10px">${c.author_role}</span><span class="comment-time">${new Date(c.created_at).toLocaleString()}</span></div><div class="comment-content">${c.content}</div></div>
    `).join('');
  }
}

async function addComment() {
  const input = document.getElementById('commentInput');
  if (!input.value.trim()) return;
  try {
    await post('/api/student/comments', { content: input.value });
    input.value = '';
    load();
  } catch (e) { alert(e.message); }
}

load();
setInterval(load, 5000);
</script>
</body>
</html>
