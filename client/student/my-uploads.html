<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Uploads - KV PTA Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="main-content">
  <div id="header" class="top-header"></div>
  <div class="content-area">
    <div class="card" style="padding:0;margin-bottom:16px">
      <div style="padding:16px 20px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;color:var(--text-primary)">Upload File</div>
      <div style="padding:20px">
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <input class="form-input" id="fileName" placeholder="File name" style="flex:1;min-width:200px">
          <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.txt,.md,.ppt,.pptx,.xls,.xlsx,.csv,.jpg,.jpeg,.png,.zip" style="flex:2;min-width:300px;padding:6px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px">
          <select class="form-input" id="fileCategory" style="width:160px">
            <option value="supplementary">Supplementary</option>
            <option value="formal">Formal Document</option>
          </select>
          <button class="btn btn-primary" onclick="uploadFile()">Upload</button>
        </div>
        <div id="uploadMsg" style="font-size:13px;margin-top:8px;display:none"></div>
      </div>
    </div>

    <div class="card" style="padding:0">
      <div style="padding:16px 20px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;color:var(--text-primary)">My Uploads</div>
      <div id="uploadsContainer" style="padding:16px 20px"></div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
const user = requireAuth();
if (user.role !== 'student') redirectByRole(user.role);
renderPage('My Uploads');

async function load() {
  let uploads;
  try { uploads = await get('/api/student/uploads'); } catch { uploads = []; }
  const container = document.getElementById('uploadsContainer');

  if (uploads.length === 0) {
    container.innerHTML = '<div style="padding:8px 0;text-align:center;color:var(--text-muted);font-size:13px">No files uploaded</div>';
    return;
  }

  const groups = {};
  for (const u of uploads) {
    const key = new Date(u.uploaded_at).toISOString().split('T')[0];
    if (!groups[key]) groups[key] = [];
    groups[key].push(u);
  }

  const today = new Date().toISOString().split('T')[0];
  const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
  const labels = { [today]: 'Today', [yesterday]: 'Yesterday' };

  container.innerHTML = Object.keys(groups).sort((a, b) => b.localeCompare(a)).map(key => {
    const label = labels[key] || new Date(key + 'T12:00:00').toLocaleDateString('en-MY', { day: 'numeric', month: 'short', year: 'numeric' });
    return `
      <div style="font-weight:700;font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;margin:12px 0 6px">${label}</div>
      ${groups[key].map(u => {
        const d = new Date(u.uploaded_at);
        const timeStr = d.toLocaleTimeString('en-MY', { hour: '2-digit', minute: '2-digit' });
        const badgeClass = u.category === 'formal' ? 'badge-blue' : 'badge-gray';
        return `
          <div style="border:1.5px solid var(--border);border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:12px;margin-bottom:6px">
            <div style="width:34px;height:34px;border-radius:6px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;flex-shrink:0">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            </div>
            <div style="flex:1;min-width:0">
              <div style="font-weight:600;font-size:13px;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                <a href="/api/files/uploads/${u.id}" target="_blank" style="color:inherit;text-decoration:none">${u.file_name}</a>
              </div>
              <div style="font-size:11px;color:var(--text-secondary);margin-top:1px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                <span class="badge ${badgeClass}" style="font-size:9px;padding:1px 6px">${u.category}</span>
                ${u.file_type ? '<span>·</span><span class="badge badge-gray" style="font-size:9px;padding:1px 6px">' + u.file_type + '</span>' : ''}
                <span>·</span>
                <span>${timeStr}</span>
                ${u.teacher_id ? '<span>·</span><span style="color:var(--primary)">by teacher</span>' : ''}
              </div>
            </div>
          </div>
        `;
      }).join('')}
    `;
  }).join('');
}

async function uploadFile() {
  const fileInput = document.getElementById('fileInput');
  const fileNameInput = document.getElementById('fileName');
  const category = document.getElementById('fileCategory').value;
  const msg = document.getElementById('uploadMsg');

  if (!fileInput.files || !fileInput.files[0]) {
    msg.textContent = 'Please select a file';
    msg.style.color = 'var(--red)'; msg.style.display = 'block'; return;
  }

  const file = fileInput.files[0];
  if (file.size > 25 * 1024 * 1024) {
    msg.textContent = 'File too large. Max 25MB.';
    msg.style.color = 'var(--red)'; msg.style.display = 'block'; return;
  }

  const file_name = fileNameInput.value || file.name;
  msg.textContent = 'Uploading...';
  msg.style.color = 'var(--green)'; msg.style.display = 'block';

  try {
    const reader = new FileReader();
    reader.onload = async function(e) {
      const base64 = e.target.result.split(',')[1];
      try {
        await post('/api/student/uploads', { file_name, file_data: base64, file_type: file.type, category });
        fileInput.value = '';
        fileNameInput.value = '';
        msg.textContent = 'File uploaded!';
        msg.style.color = 'var(--green)'; msg.style.display = 'block';
        load();
        setTimeout(() => msg.style.display = 'none', 2000);
      } catch (err) {
        msg.textContent = err.message;
        msg.style.color = 'var(--red)'; msg.style.display = 'block';
      }
    };
    reader.readAsDataURL(file);
  } catch (e) {
    msg.textContent = e.message;
    msg.style.color = 'var(--red)'; msg.style.display = 'block';
  }
}

load();
</script>
</body>
</html>
