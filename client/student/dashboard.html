<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - KV PTA Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css">
<script>if (window.location.protocol === 'file:') window.location.replace('http://127.0.0.1:4000/');</script>
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="main-content">
  <div id="header" class="top-header"></div>
  <div class="content-area">
    <div class="stat-grid" id="statCards">
      <div class="skeleton skeleton-stat"></div>
      <div class="skeleton skeleton-stat"></div>
      <div class="skeleton skeleton-stat"></div>
      <div class="skeleton skeleton-stat"></div>
    </div>
    <div class="dashboard-grid" id="dashboardOverview" style="display:none">
      <section class="card dashboard-panel" id="projectOverview"></section>
      <section class="card dashboard-panel dashboard-panel--accent" id="nextMeeting"></section>
    </div>
    <div id="activityCard" class="card-accent" style="margin-bottom:16px;display:none">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--primary-deep)" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span style="font-size:13px;font-weight:600;color:var(--primary-deep)">Recent Activity</span>
      </div>
      <div id="activityList" style="font-size:13px;color:var(--text-secondary)"></div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
const user = requireAuth();
if (user.role !== 'student') redirectByRole(user.role);
renderPage('Dashboard');

const STATUS_BADGE = { draft: 'badge-gray', submitted: 'badge-yellow', approved: 'badge-green', rejected: 'badge-red', revision: 'badge-yellow' };

function timeAgo(val) {
  if (!val) return '';
  const diff = Date.now() - new Date(val).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs / 24);
  if (days < 7) return days + 'd ago';
  return new Date(val).toLocaleDateString('en-MY', { day: 'numeric', month: 'short' });
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function load() {
  let group, projects, meetings, comments, notifs, githubStatus;
  try { group = await get('/api/student/group'); } catch { group = null; }
  try { projects = await get('/api/student/projects'); } catch { projects = []; }
  try { meetings = await get('/api/student/meetings'); } catch { meetings = []; }
  try { comments = await get('/api/student/comments'); } catch { comments = []; }
  try { notifs = await get('/api/notifications'); } catch { notifs = []; }
  try { githubStatus = await get('/api/github/status'); } catch { githubStatus = { connected: false }; }

  const project = projects.length ? projects[0] : null;
  const status = project ? project.status : (group ? 'draft' : 'no group');
  const statusLabel = status === 'no group' ? 'No Group' : (status || 'draft');
  const githubLabel = githubStatus.connected ? 'Linked' : 'Not linked';

  document.getElementById('statCards').innerHTML = `
    <div class="stat-card animate-in">
      <div class="stat-label">Group</div>
      <div class="stat-value">${group ? escapeHtml(group.group_name) : '—'}</div>
      <div class="stat-trend neutral">${group ? 'Assigned' : 'None'}</div>
      <div class="stat-icon-float">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
    </div>
    <div class="stat-card animate-in">
      <div class="stat-label">Project</div>
      <div class="stat-value" style="font-size:20px">${project ? escapeHtml(project.title) : '—'}</div>
      <div class="stat-trend ${project ? 'positive' : 'neutral'}">${project ? 'Active' : 'No project yet'}</div>
      <div class="stat-icon-float">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      </div>
    </div>
    <div class="stat-card accent animate-in">
      <div class="stat-label">Status</div>
      <div class="stat-value"><span class="badge ${STATUS_BADGE[status] || 'badge-gray'}">${statusLabel}</span></div>
      <div class="stat-trend ${project && project.status === 'approved' ? 'positive' : 'neutral'}">${project && project.status === 'approved' ? 'Approved' : project ? 'In review' : 'Not started'}</div>
      <div class="stat-icon-float">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </div>
    </div>
    <div class="stat-card animate-in">
      <div class="stat-label">GitHub</div>
      <div class="stat-value" style="font-size:20px">${githubLabel}</div>
      <div class="stat-trend ${githubStatus.connected ? 'positive' : 'neutral'}">${githubStatus.connected ? 'Connected' : 'Connect to link repo'}</div>
      <div class="stat-icon-float">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
      </div>
    </div>
  `;

  renderOverview(project, group, meetings, comments);

  renderActivity(meetings, comments, notifs);
}

function renderOverview(project, group, meetings, comments) {
  const overview = document.getElementById('dashboardOverview');
  const projectPanel = document.getElementById('projectOverview');
  const meetingPanel = document.getElementById('nextMeeting');
  if (!project && !group && !meetings.length) {
    overview.style.display = 'none';
    return;
  }

  const status = project?.status || 'draft';
  const statusClass = STATUS_BADGE[status] || 'badge-gray';
  const statusLabel = status === 'revision' ? 'Needs revision' : status;
  const progress = status === 'approved' ? 100 : status === 'submitted' ? 72 : status === 'revision' ? 50 : project ? 28 : 0;
  const projectTitle = project?.title || 'Project workspace';
  const projectCopy = project?.objective || project?.purpose || 'Your assigned project will appear here once the workspace is ready.';
  const next = meetings[0];
  const meetingDate = next?.meeting_date ? new Date(next.meeting_date) : null;
  const dateLabel = meetingDate ? meetingDate.toLocaleDateString('en-MY', { day: '2-digit', month: 'short' }).toUpperCase() : 'NO DATE';
  const meetingTime = next?.meeting_time || (meetingDate ? meetingDate.toLocaleTimeString('en-MY', { hour: 'numeric', minute: '2-digit' }) : 'Schedule with your teacher');

  overview.style.display = 'grid';
  projectPanel.innerHTML = `
    <div class="panel-eyebrow">Project at a glance</div>
    <span class="badge ${statusClass}">${escapeHtml(statusLabel)}</span>
    <h2 class="panel-title" style="margin-top:14px">${escapeHtml(projectTitle)}</h2>
    <p class="panel-copy">${escapeHtml(projectCopy)}</p>
    <div style="display:flex;justify-content:space-between;gap:12px;margin:24px 0 8px">
      <span class="panel-eyebrow" style="margin:0">Project progress</span>
      <span class="panel-meta">${progress}% complete</span>
    </div>
    <div class="progress-bar"><span style="width:${progress}%"></span></div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px">
      <span class="panel-meta">${comments.length} feedback item${comments.length === 1 ? '' : 's'}</span>
      <a href="/student/project.html${project?.id ? '?project=' + encodeURIComponent(project.id) : ''}" class="btn btn-soft btn-sm">Open project</a>
    </div>
  `;
  meetingPanel.innerHTML = `
    <div class="panel-eyebrow">Next supervision</div>
    <div style="font-size:30px;font-weight:600;line-height:1.2;margin:8px 0 16px">${dateLabel}</div>
    <div class="panel-copy">${escapeHtml(meetingTime)}</div>
    <div class="panel-copy" style="margin-top:10px">${escapeHtml(next?.teacher_name || 'Your teacher')}</div>
    <div style="margin-top:30px"><a href="/student/meetings.html" class="btn btn-secondary btn-sm">View meeting logs</a></div>
  `;
}

function renderActivity(meetings, comments, notifs) {
  const card = document.getElementById('activityCard');
  const list = document.getElementById('activityList');
  const items = [];

  meetings.forEach(m => {
    items.push({
      time: m.meeting_date ? timeAgo(m.meeting_date) : '',
      text: '<strong>' + escapeHtml(m.teacher_name || 'Your teacher') + '</strong> added a meeting log',
      icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--primary-deep)" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>'
    });
  });

  comments.forEach(c => {
    items.push({
      time: timeAgo(c.created_at),
      text: '<strong>' + escapeHtml(c.author_name || 'Someone') + '</strong> commented: ' + escapeHtml(c.content && c.content.length > 60 ? c.content.slice(0, 60) + '…' : c.content),
      icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--primary-deep)" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'
    });
  });

  notifs.forEach(n => {
    items.push({
      time: timeAgo(n.created_at),
      text: '<strong>' + escapeHtml(n.title || 'Notification') + '</strong>' + (n.message ? ' — ' + escapeHtml(n.message.length > 60 ? n.message.slice(0, 60) + '…' : n.message) : ''),
      icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--primary-deep)" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>'
    });
  });

  items.sort((a, b) => {
    if (!a.time && !b.time) return 0;
    if (!a.time) return 1;
    if (!b.time) return -1;
    return b.time.localeCompare(a.time);
  });

  const recent = items.slice(0, 5);
  if (recent.length === 0) { card.style.display = 'none'; return; }
  card.style.display = 'block';
  list.innerHTML = recent.map(item => `
    <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-light)">
      <div style="width:28px;height:28px;border-radius:50%;background:var(--primary-lighter);display:flex;align-items:center;justify-content:center;flex-shrink:0">${item.icon}</div>
      <div style="flex:1;min-width:0">${item.text}</div>
      <span style="font-size:11px;color:var(--text-muted);white-space:nowrap">${item.time}</span>
    </div>
  `).join('');
}

load();
</script>
</body>
</html>
