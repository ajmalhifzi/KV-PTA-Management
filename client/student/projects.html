<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Projects - KV PTA Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css">
<style>
  .form-input { width:100%;padding:10px 12px;border:1px solid var(--gray-300);border-radius:6px;font-size:14px;outline:none;transition:border 0.15s;font-family:inherit }
  .form-input:focus { border-color:var(--soft-blue-400);box-shadow:0 0 0 3px var(--soft-blue-100) }
  textarea.form-input { resize:vertical }
  .field-label { display:block;font-size:12px;font-weight:600;color:var(--gray-500);margin-bottom:4px }
  .msg-success { font-size:13px;color:#2b8a3e;margin-bottom:8px }
  .msg-error { font-size:13px;color:#c92a2a;margin-bottom:8px }
</style>
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="main-content">
  <div id="header" class="top-header"></div>
  <div class="content-area">

    <div id="noProject" style="display:none">
      <div class="card" style="max-width:600px;text-align:center;padding:48px">
        <p style="font-size:16px;font-weight:600;color:var(--dark-blue-800);margin-bottom:8px">No Project Yet</p>
        <p style="font-size:13px;color:var(--gray-500);margin-bottom:20px">Submit your FYP idea to get started.</p>
        <button class="btn btn-primary" onclick="showNewForm()">Create Project</button>
      </div>
      <div id="newProjectForm" style="display:none;max-width:600px">
        <div class="card">
          <h3 style="font-size:16px;font-weight:700;color:var(--dark-blue-800);margin-bottom:16px">Create Project</h3>
          <div class="form-group"><label class="field-label">Group Name</label><input class="form-input" id="newGroupName"></div>
          <div class="form-group"><label class="field-label">Project Title</label><input class="form-input" id="newTitle"></div>
          <div class="form-group"><label class="field-label">Objective</label><textarea class="form-input" id="newObjective" rows="2"></textarea></div>
          <div class="form-group"><label class="field-label">Purpose</label><textarea class="form-input" id="newPurpose" rows="2"></textarea></div>
          <div class="form-group"><label class="field-label">Scope</label><textarea class="form-input" id="newScope" rows="2"></textarea></div>
          <div id="newProjectMsg" style="font-size:13px;margin-bottom:12px;display:none"></div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-primary" onclick="saveNewProject()">Save</button>
            <button class="btn btn-secondary" onclick="location.reload()">Cancel</button>
          </div>
        </div>
      </div>
    </div>

    <div id="projectView" style="display:none">
      <div id="projectList"></div>
    </div>

    <div id="linkRepoModal" class="modal-overlay" style="display:none">
      <div class="card" style="max-width:500px;width:90%;max-height:80vh;overflow-y:auto;padding:20px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <h3 style="font-size:16px;font-weight:700;color:var(--dark-blue-800)">Select Repository</h3>
          <button onclick="closeLinkRepoModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--gray-400)">&times;</button>
        </div>
        <div id="repoList" style="max-height:400px;overflow-y:auto">
          <div style="text-align:center;padding:24px;color:var(--gray-400);font-size:13px">Loading repositories...</div>
        </div>
        <div style="margin-top:12px;font-size:12px;color:var(--gray-400)">Only showing your 100 most recently updated repositories.</div>
      </div>
    </div>

  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
const user = requireAuth();
if (user.role !== 'student') redirectByRole(user.role);
renderPage('Projects');

let projectsData = null;
let expandedProjectId = null;

function timeAgo(val) {
  const diff = Date.now() - new Date(val).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs / 24);
  if (days < 7) return days + 'd ago';
  return new Date(val).toLocaleDateString('en-MY', { day: 'numeric', month: 'short' });
}

async function load() {
  try {
    const data = await get('/api/student/group');
    projectsData = data;

    if (!data.project_id) {
      document.getElementById('noProject').style.display = 'block';
      document.getElementById('projectView').style.display = 'none';
      return;
    }

    document.getElementById('noProject').style.display = 'none';
    document.getElementById('projectView').style.display = 'block';

    renderProject(data);

    const hash = window.location.hash.replace('#project-', '');
    if (hash && hash === data.project_id) {
      expandProject(data.project_id);
    }

    loadNavProjects();
  } catch {
    document.getElementById('noProject').style.display = 'block';
    document.getElementById('projectView').style.display = 'none';
  }
}

function renderProject(data) {
  const status = data.status || 'draft';
  const badgeClass = status === 'approved' ? 'badge-green' : status === 'rejected' ? 'badge-red' : status === 'submitted' ? 'badge-yellow' : 'badge-gray';

  const list = document.getElementById('projectList');
  list.innerHTML = `
    <div class="card project-card" id="projectCard_${data.project_id}">
      <div class="project-header" onclick="toggleProject('${data.project_id}')">
        <span class="project-arrow" id="arrow_${data.project_id}">&#9654;</span>
        <div style="flex:1;min-width:0">
          <div style="font-size:15px;font-weight:700;color:var(--dark-blue-800)">${data.title || '(No title)'}</div>
          <div style="font-size:11px;color:var(--gray-400);margin-top:2px">${data.group_name} &middot; ${data.teacher_name}</div>
        </div>
        <span class="badge ${badgeClass}" style="font-size:11px">${status}</span>
      </div>
      <div class="project-body" id="body_${data.project_id}">
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding:10px 14px;background:var(--soft-blue-50);border-radius:6px;font-size:13px">
          <span><strong style="color:var(--dark-blue-700)">Group:</strong> ${data.group_name}</span>
          <span><strong style="color:var(--dark-blue-700)">Teacher:</strong> ${data.teacher_name} (${data.teacher_email})</span>
        </div>

        <div id="proposalFields_${data.project_id}">
          <div class="form-group">
            <label class="field-label">Project Title</label>
            <input class="form-input" id="editTitle_${data.project_id}" value="${escapeHtml(data.title || '')}">
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div class="form-group">
              <label class="field-label">Objective</label>
              <textarea class="form-input" id="editObjective_${data.project_id}" rows="2">${escapeHtml(data.objective || '')}</textarea>
            </div>
            <div class="form-group">
              <label class="field-label">Purpose</label>
              <textarea class="form-input" id="editPurpose_${data.project_id}" rows="2">${escapeHtml(data.purpose || '')}</textarea>
            </div>
          </div>
          <div class="form-group">
            <label class="field-label">Scope</label>
            <textarea class="form-input" id="editScope_${data.project_id}" rows="2">${escapeHtml(data.scope || '')}</textarea>
          </div>
          <div id="editMsg_${data.project_id}" style="display:none"></div>
          <div style="display:flex;gap:8px;margin-bottom:16px">
            <button class="btn btn-primary btn-sm" onclick="saveProject('${data.project_id}')">Save Changes</button>
            ${status === 'draft' ? '<button class="btn btn-soft btn-sm" onclick="submitProject()">Submit for Review</button>' : ''}
          </div>
        </div>

        <div id="githubSection_${data.project_id}" style="border-top:1px solid var(--gray-200);padding-top:16px">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--dark-blue-600)"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
            <span style="font-size:13px;font-weight:600;color:var(--dark-blue-800)">GitHub Repository</span>
            <span id="githubBadge_${data.project_id}" class="badge badge-gray" style="font-size:10px;display:none"></span>
          </div>
          <div id="githubContent_${data.project_id}">
            <div style="text-align:center;padding:12px;color:var(--gray-400);font-size:12px">Loading GitHub status...</div>
          </div>
        </div>
      </div>
    </div>
  `;

  if (data.github_repo_url) {
    loadGitHubData(data);
  } else {
    checkGitHubStatus(data);
  }
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toggleProject(id) {
  const body = document.getElementById('body_' + id);
  const arrow = document.getElementById('arrow_' + id);
  if (!body || !arrow) return;
  const isOpen = body.classList.toggle('open');
  arrow.classList.toggle('open', isOpen);
  if (isOpen) {
    expandedProjectId = id;
    const data = projectsData;
    if (data && data.github_repo_url) {
      loadGitHubData(data);
    } else if (data) {
      checkGitHubStatus(data);
    }
  } else {
    expandedProjectId = null;
  }
}

function expandProject(id) {
  const body = document.getElementById('body_' + id);
  const arrow = document.getElementById('arrow_' + id);
  if (!body || !arrow) return;
  body.classList.add('open');
  arrow.classList.add('open');
  expandedProjectId = id;
  const data = projectsData;
  if (data && data.github_repo_url) {
    loadGitHubData(data);
  } else if (data) {
    checkGitHubStatus(data);
  }
}

async function saveProject(id) {
  const msg = document.getElementById('editMsg_' + id);
  msg.style.display = 'none';
  try {
    const body = {
      group_name: projectsData.group_name,
      title: document.getElementById('editTitle_' + id).value,
      objective: document.getElementById('editObjective_' + id).value,
      purpose: document.getElementById('editPurpose_' + id).value,
      scope: document.getElementById('editScope_' + id).value
    };
    await put('/api/student/group', body);
    msg.className = 'msg-success';
    msg.textContent = 'Project saved successfully.';
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', 3000);
    load();
  } catch (e) {
    msg.className = 'msg-error';
    msg.textContent = e.message;
    msg.style.display = 'block';
  }
}

async function submitProject() {
  try {
    await post('/api/student/project/submit');
    load();
  } catch (e) { alert(e.message); }
}

function showNewForm() {
  document.getElementById('noProject').querySelector('.card').style.display = 'none';
  document.getElementById('newProjectForm').style.display = 'block';
}

async function saveNewProject() {
  const msg = document.getElementById('newProjectMsg');
  msg.style.display = 'none';
  try {
    await put('/api/student/group', {
      group_name: document.getElementById('newGroupName').value.trim(),
      title: document.getElementById('newTitle').value.trim(),
      objective: document.getElementById('newObjective').value.trim(),
      purpose: document.getElementById('newPurpose').value.trim(),
      scope: document.getElementById('newScope').value.trim()
    });
    location.reload();
  } catch (e) {
    msg.className = 'msg-error';
    msg.textContent = e.message;
    msg.style.display = 'block';
  }
}

/* GitHub */

async function checkGitHubStatus(data) {
  const container = document.getElementById('githubContent_' + data.project_id);
  try {
    const statusRes = await get('/api/github/status');
    if (statusRes.connected) {
      container.innerHTML = `
        <div style="font-size:12px;color:var(--gray-500);margin-bottom:6px">Connected as <strong style="color:var(--dark-blue-700)">${statusRes.github_username}</strong></div>
        <button class="btn btn-primary btn-sm" onclick="showLinkRepoModal('${data.project_id}')" style="font-size:12px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:4px"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          Link Repository
        </button>
      `;
    } else {
      container.innerHTML = `
        <p style="font-size:12px;color:var(--gray-500);margin-bottom:8px">Connect your GitHub account to link a repository to this project.</p>
        <button class="btn btn-primary btn-sm" onclick="connectGitHub()" style="font-size:12px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="margin-right:4px"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
          Connect GitHub
        </button>
      `;
    }
  } catch {
    container.innerHTML = '<div style="text-align:center;padding:12px;color:var(--gray-400);font-size:12px">Failed to check GitHub status.</div>';
  }
}

async function loadGitHubData(data) {
  const container = document.getElementById('githubContent_' + data.project_id);
  const badge = document.getElementById('githubBadge_' + data.project_id);
  try {
    const summary = await get('/api/github/my-repo-summary');
    const repoFullName = data.github_repo_url.replace('https://github.com/', '');
    badge.textContent = 'Repo Linked';
    badge.className = 'badge badge-green';
    badge.style.display = 'inline-block';

    let extraInfo = '';
    if (summary.linked && summary.lastCommit) {
      extraInfo += '<div style="margin-top:4px;font-size:11px;color:var(--gray-400)">Last commit: ' + new Date(summary.lastCommit.date).toLocaleString() + ' by ' + summary.lastCommit.author + '</div>';
    }
    if (summary.language) {
      extraInfo += ' <span class="badge badge-blue" style="font-size:9px">' + summary.language + '</span>';
    }
    if (summary.private) {
      extraInfo += ' <span class="badge badge-gray" style="font-size:9px">Private</span>';
    }

    container.innerHTML = `
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <a href="${data.github_repo_url}" target="_blank" style="font-size:13px;font-weight:600;color:var(--dark-blue-600);text-decoration:none;display:flex;align-items:center;gap:4px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          ${repoFullName}
        </a>
        ${extraInfo}
      </div>
      <div id="commitArea_${data.project_id}" style="margin-top:8px"></div>
      <div style="margin-top:6px">
        <button class="btn btn-secondary btn-sm" onclick="unlinkRepo()" style="color:var(--badge-red);font-size:11px">Unlink</button>
      </div>
    `;
    loadStudentCommits(data.project_id);
  } catch {
    container.innerHTML = '<div style="text-align:center;padding:12px;color:var(--gray-400);font-size:12px">Failed to load repo data.</div>';
  }
}

async function loadStudentCommits(pid) {
  try {
    const commits = await get('/api/github/my-commits?limit=15');
    const area = document.getElementById('commitArea_' + pid);
    if (!area) return;
    if (!commits.length) { area.innerHTML = ''; return; }
    area.innerHTML = '<div style="font-size:12px;font-weight:600;color:var(--dark-blue-700);margin-bottom:4px">Recent Commits & Feedback</div>' +
      '<div style="max-height:200px;overflow-y:auto">' +
      commits.map(c => {
        const hasComments = c.comments && c.comments.length > 0;
        return '<div style="padding:6px 0;border-bottom:1px solid var(--gray-100);font-size:12px">' +
          '<div style="display:flex;align-items:flex-start;gap:4px">' +
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--gray-400)" stroke-width="2" style="margin-top:3px;flex-shrink:0"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>' +
            '<div style="flex:1">' +
              '<a href="' + c.url + '" target="_blank" style="color:var(--dark-blue-700);text-decoration:none;font-weight:500">' + c.message.split('\n')[0] + '</a>' +
              '<div style="font-size:10px;color:var(--gray-400);margin-top:1px">' +
                '<span>' + c.author + '</span> <span>&middot;</span> <span>' + timeAgo(c.date) + '</span> <span>&middot;</span> <span style="font-family:monospace">' + c.sha.slice(0,7) + '</span>' +
                (hasComments ? ' <span style="color:var(--dark-blue-600)">&middot; ' + c.comments.length + ' comment(s)</span>' : '') +
              '</div>' +
              (hasComments ? '<div style="margin-top:4px">' + c.comments.map(cmt =>
                '<div style="padding:4px 6px;margin-top:3px;background:var(--soft-blue-50);border-radius:4px;font-size:11px">' +
                  '<strong style="color:var(--dark-blue-700)">' + cmt.author + '</strong> ' +
                  '<span style="color:var(--gray-600)">' + cmt.body + '</span>' +
                '</div>'
              ).join('') + '</div>' : '') +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('') +
      '</div>';
  } catch {}
}

function connectGitHub() {
  const token = localStorage.getItem('token');
  window.location.href = '/api/github/login?token=' + encodeURIComponent(token);
}

function showLinkRepoModal(pid) {
  document.getElementById('linkRepoModal').style.display = 'flex';
  const repoList = document.getElementById('repoList');
  repoList.innerHTML = '<div style="text-align:center;padding:24px;color:var(--gray-400);font-size:13px">Loading repositories...</div>';
  get('/api/github/user-repos').then(repos => {
    if (repos.length === 0) {
      repoList.innerHTML = '<div style="text-align:center;padding:24px;color:var(--gray-400);font-size:13px">No repositories found. Create one on GitHub first.</div>';
      return;
    }
    repoList.innerHTML = repos.map(r => `
      <div class="repo-item" onclick="linkRepo('${r.name}')" style="padding:10px 12px;border:1px solid var(--gray-200);border-radius:6px;margin-bottom:6px;cursor:pointer;transition:background 0.15s" onmouseenter="this.style.background='var(--soft-blue-50)'" onmouseleave="this.style.background=''">
        <div style="display:flex;align-items:center;gap:6px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="${r.private ? 'var(--badge-yellow)' : 'var(--gray-400)'}"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
          <strong style="font-size:14px;color:var(--dark-blue-700)">${r.name}</strong>
        </div>
        ${r.description ? '<div style="font-size:12px;color:var(--gray-500);margin-top:4px;margin-left:22px">' + r.description + '</div>' : ''}
      </div>
    `).join('');
  }).catch(() => {
    repoList.innerHTML = '<div style="text-align:center;padding:24px;color:var(--badge-red);font-size:13px">Failed to load repositories.</div>';
  });
}

function closeLinkRepoModal() {
  document.getElementById('linkRepoModal').style.display = 'none';
}

async function linkRepo(repoFullName) {
  try {
    await post('/api/github/link-repo', { repoFullName });
    closeLinkRepoModal();
    location.reload();
  } catch (e) { alert(e.message); }
}

async function unlinkRepo() {
  if (!confirm('Unlink this repository from the project?')) return;
  try {
    await post('/api/github/unlink-repo');
    location.reload();
  } catch (e) { alert(e.message); }
}

/* Init */
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('github') === 'connected') {
  history.replaceState(null, '', window.location.pathname);
  setTimeout(() => alert('GitHub connected successfully!'), 500);
}

load();
</script>
