<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects - KV PTA Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css">
<style>
  textarea.form-input { resize:vertical }
  .field-label { display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px }
  .msg-success { font-size:13px;color:#2b8a3e;margin-bottom:8px }
  .msg-error { font-size:13px;color:#c92a2a;margin-bottom:8px }
</style>
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="main-content">
  <div id="header" class="top-header"></div>
  <div class="content-area">

    <div id="noProject" style="display:none">
      <div class="card" style="max-width:600px;text-align:center;padding:48px">
        <p style="font-size:16px;font-weight:600;color:var(--text-primary);margin-bottom:8px">No Project Yet</p>
        <p style="font-size:13px;color:var(--text-secondary);margin-bottom:20px">Submit your FYP idea to get started.</p>
        <button class="btn btn-primary" onclick="showNewForm()">Create Project</button>
      </div>
      <div id="newProjectForm" style="display:none;max-width:600px">
        <div class="card">
          <h3 style="font-size:16px;font-weight:700;color:var(--text-primary);margin-bottom:16px">Create Project</h3>
          <div class="form-group"><label class="field-label">Group Name</label><input class="form-input" id="newGroupName"></div>
          <div class="form-group"><label class="field-label">Project Title</label><input class="form-input" id="newTitle"></div>
          <div class="form-group"><label class="field-label">Objective</label><textarea class="form-input" id="newObjective" rows="2"></textarea></div>
          <div class="form-group"><label class="field-label">Purpose</label><textarea class="form-input" id="newPurpose" rows="2"></textarea></div>
          <div class="form-group"><label class="field-label">Scope</label><textarea class="form-input" id="newScope" rows="2"></textarea></div>
          <div id="newProjectMsg" style="font-size:13px;margin-bottom:12px;display:none"></div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-primary" onclick="saveNewProject()">Save</button>
            <button class="btn btn-secondary" onclick="location.reload()">Cancel</button>
          </div>
        </div>
      </div>
    </div>

    <div id="projectList" style="display:none">
      <div style="max-width:700px;margin:0 auto">
        <h3 style="font-size:16px;font-weight:700;color:var(--text-primary);margin-bottom:16px">My Projects</h3>
        <div id="projectListContainer"></div>
      </div>
    </div>

  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
const user = requireAuth();
if (user.role !== 'student') redirectByRole(user.role);
renderPage('Projects');

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function load() {
  try {
    const projects = await get('/api/student/projects');
    if (!projects.length) {
      document.getElementById('projectList').style.display = 'none';
      document.getElementById('noProject').style.display = 'block';
      return;
    }
    document.getElementById('noProject').style.display = 'none';
    document.getElementById('projectList').style.display = 'block';
    document.getElementById('projectListContainer').innerHTML = projects.map(p => {
      const badgeClass = p.status === 'approved' ? 'badge-green' : p.status === 'rejected' ? 'badge-red' : p.status === 'submitted' ? 'badge-yellow' : 'badge-gray';
      return '<div class="card" style="cursor:pointer;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between" onclick="openProject(\'' + p.id + '\')">' +
        '<div><div style="font-size:15px;font-weight:600;color:var(--text-primary)">' + escapeHtml(p.title || '(Untitled)') + '</div>' +
        '<div style="font-size:12px;color:var(--text-secondary);margin-top:2px">' + escapeHtml(p.group_name) + '</div></div>' +
        '<span class="badge ' + badgeClass + '" style="font-size:11px">' + p.status + '</span></div>';
    }).join('');
  } catch {
    document.getElementById('projectList').style.display = 'none';
    document.getElementById('noProject').style.display = 'block';
  }
}

function openProject(id) {
  window.location.href = '/student/project.html?project=' + id;
}

function showNewForm() {
  document.getElementById('noProject').querySelector('.card').style.display = 'none';
  document.getElementById('newProjectForm').style.display = 'block';
}

async function saveNewProject() {
  const msg = document.getElementById('newProjectMsg');
  msg.style.display = 'none';
  try {
    await put('/api/student/group', {
      group_name: document.getElementById('newGroupName').value.trim(),
      title: document.getElementById('newTitle').value.trim(),
      objective: document.getElementById('newObjective').value.trim(),
      purpose: document.getElementById('newPurpose').value.trim(),
      scope: document.getElementById('newScope').value.trim()
    });
    location.reload();
  } catch (e) {
    msg.className = 'msg-error';
    msg.textContent = e.message;
    msg.style.display = 'block';
  }
}

/* Init */
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('github') === 'connected') {
  history.replaceState(null, '', window.location.pathname);
  setTimeout(() => alert('GitHub connected successfully!'), 500);
}

load();
</script>
</body>
</html>
