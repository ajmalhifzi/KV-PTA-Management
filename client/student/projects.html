<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects - KV PTA Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css">
<style>
  textarea.form-input { resize:vertical }
  .field-label { display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px }
  .msg-success { font-size:13px;color:var(--green);margin-bottom:8px }
  .msg-error { font-size:13px;color:var(--red);margin-bottom:8px }
  .modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px }
</style>
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="main-content">
  <div id="header" class="top-header"></div>
  <div class="content-area">

    <div id="projectList" style="max-width:700px;margin:0 auto">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <h3 style="font-size:16px;font-weight:700;color:var(--text-primary)">My Projects</h3>
        <button class="btn btn-primary" onclick="openCreateModal()">Create New Project</button>
      </div>
      <div id="projectListContainer"></div>
    </div>

  </div>
</div>

<div id="createModal" class="modal-overlay" style="display:none">
  <div class="card" style="max-width:520px;width:100%">
    <h3 style="font-size:16px;font-weight:700;color:var(--text-primary);margin-bottom:16px">Create New Project</h3>
    <div class="form-group"><label class="field-label">Project Title *</label><input class="form-input" id="newTitle" placeholder="e.g. Smart Waste Sorter"></div>
    <div class="form-group"><label class="field-label">Objective</label><textarea class="form-input" id="newObjective" rows="2"></textarea></div>
    <div class="form-group"><label class="field-label">Purpose</label><textarea class="form-input" id="newPurpose" rows="2"></textarea></div>
    <div class="form-group"><label class="field-label">Scope</label><textarea class="form-input" id="newScope" rows="2"></textarea></div>
    <div id="createMsg" style="font-size:13px;margin-bottom:12px;display:none"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-secondary" onclick="closeCreateModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveNewProject()">Create</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
const user = requireAuth();
if (user.role !== 'student') redirectByRole(user.role);
renderPage('Projects');

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function load() {
  try {
    const projects = await get('/api/student/projects');
    const container = document.getElementById('projectListContainer');
    if (!projects.length) {
      container.innerHTML = '<div class="card" style="text-align:center;padding:48px">' +
        '<p style="font-size:16px;font-weight:600;color:var(--text-primary);margin-bottom:8px">No Projects Yet</p>' +
        '<p style="font-size:13px;color:var(--text-secondary);margin-bottom:20px">Create your first FYP project to get started.</p>' +
        '<button class="btn btn-primary" onclick="openCreateModal()">Create New Project</button></div>';
      return;
    }
    container.innerHTML = projects.map(p => {
      const badgeClass = p.status === 'approved' ? 'badge-green' : p.status === 'rejected' ? 'badge-red' : p.status === 'submitted' ? 'badge-yellow' : 'badge-gray';
      return '<div class="card" style="cursor:pointer;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between" onclick="openProject(\'' + p.id + '\')">' +
        '<div><div style="font-size:15px;font-weight:600;color:var(--text-primary)">' + escapeHtml(p.title || '(Untitled)') + '</div>' +
        '<div style="font-size:12px;color:var(--text-secondary);margin-top:2px">' + escapeHtml(p.group_name) + '</div></div>' +
        '<span class="badge ' + badgeClass + '" style="font-size:11px">' + p.status + '</span></div>';
    }).join('');
  } catch (e) {
    document.getElementById('projectListContainer').innerHTML =
      '<div class="card" style="text-align:center;padding:32px"><p style="font-size:13px;color:var(--red)">' + escapeHtml(e.message || 'Failed to load projects') + '</p></div>';
  }
}

function openProject(id) {
  window.location.href = '/student/project.html?project=' + id;
}

function openCreateModal() {
  document.getElementById('newTitle').value = '';
  document.getElementById('newObjective').value = '';
  document.getElementById('newPurpose').value = '';
  document.getElementById('newScope').value = '';
  const msg = document.getElementById('createMsg');
  msg.style.display = 'none';
  const modal = document.getElementById('createModal');
  modal.style.display = 'flex';
  modal.classList.add('open');
  setTimeout(() => document.getElementById('newTitle').focus(), 50);
}

function closeCreateModal() {
  const modal = document.getElementById('createModal');
  modal.classList.remove('open');
  modal.style.display = 'none';
}

async function saveNewProject() {
  const msg = document.getElementById('createMsg');
  msg.style.display = 'none';
  const title = document.getElementById('newTitle').value.trim();
  if (!title) {
    msg.className = 'msg-error';
    msg.textContent = 'Project title is required';
    msg.style.display = 'block';
    return;
  }
  try {
    const project = await post('/api/student/projects', {
      title: title,
      objective: document.getElementById('newObjective').value.trim(),
      purpose: document.getElementById('newPurpose').value.trim(),
      scope: document.getElementById('newScope').value.trim()
    });
    window.location.href = '/student/project.html?project=' + project.id;
  } catch (e) {
    msg.className = 'msg-error';
    msg.textContent = e.message;
    msg.style.display = 'block';
  }
}

/* Init */
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('github') === 'connected') {
  history.replaceState(null, '', window.location.pathname);
  setTimeout(() => alert('GitHub connected successfully!'), 500);
}

load();
</script>
</body>
</html>
