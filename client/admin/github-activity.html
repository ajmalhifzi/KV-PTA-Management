<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Activity - KV PTA Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="main-content">
  <div id="header" class="top-header"></div>
  <div class="content-area">
    <div class="stat-grid" id="statCards"></div>

    <div class="card" style="padding:0;margin-bottom:24px">
      <div style="padding:16px 20px;border-bottom:1px solid var(--gray-200);font-weight:600;font-size:14px;color:var(--dark-blue-800)">GitHub Connections</div>
      <div class="table-container"><table><thead><tr><th>Student</th><th>GitHub Username</th><th>Project</th><th>Repo</th><th>Teacher</th><th>Connected</th></tr></thead><tbody id="connectionsList"></tbody></table></div>
    </div>

    <div class="card" style="padding:0">
      <div style="padding:16px 20px;border-bottom:1px solid var(--gray-200);font-weight:600;font-size:14px;color:var(--dark-blue-800)">Recent Activity</div>
      <div id="activityFeed" style="padding:16px 20px"></div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
const user = requireAuth();
if (user.role !== 'admin') redirectByRole(user.role);
renderPage('GitHub Activity');

function timeAgo(val) {
  const diff = Date.now() - new Date(val).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs / 24);
  if (days < 7) return days + 'd ago';
  return new Date(val).toLocaleDateString('en-MY', { day: 'numeric', month: 'short' });
}

function extractRepoName(msg) {
  const m = msg.match(/repo:\s*(\S+)/i) || msg.match(/(\S+\/\S+)/);
  return m ? m[1] : '';
}

async function load() {
  const data = await get('/api/admin/github-activity');

  document.getElementById('statCards').innerHTML = `
    <div class="card stat-card">
      <div class="stat-icon blue"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg></div>
      <div><div class="stat-number">${data.summary.connected_students}</div><div class="stat-label">Connected Students</div></div>
    </div>
    <div class="card stat-card">
      <div class="stat-icon green"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></div>
      <div><div class="stat-number">${data.summary.linked_repos}</div><div class="stat-label">Linked Repos</div></div>
    </div>
    <div class="card stat-card">
      <div class="stat-icon yellow"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg></div>
      <div><div class="stat-number">${data.summary.active_last_7d}</div><div class="stat-label">Commits (7d)</div></div>
    </div>
    <div class="card stat-card">
      <div class="stat-icon blue"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
      <div><div class="stat-number">${data.summary.teachers_with_engagement}</div><div class="stat-label">Teachers Engaged</div></div>
    </div>
  `;

  const connBody = document.getElementById('connectionsList');
  if (data.connections.length === 0) {
    connBody.innerHTML = '<tr><td colspan="6" class="empty-state" style="padding:32px"><p>No GitHub connections yet</p></td></tr>';
  } else {
    connBody.innerHTML = data.connections.map(c => `
      <tr>
        <td>${c.full_name}</td>
        <td><a href="https://github.com/${c.github_username}" target="_blank" style="color:var(--dark-blue-600);text-decoration:none;font-weight:500">${c.github_username}</a></td>
        <td>${c.project_title || '<span style="color:var(--gray-400)">-</span>'}</td>
        <td>${c.github_repo_url ? '<a href="' + c.github_repo_url + '" target="_blank" style="color:var(--dark-blue-600);text-decoration:none;font-size:12px">' + c.github_repo_url.replace('https://github.com/', '') + '</a>' : '<span style="color:var(--gray-400);font-size:12px">Not linked</span>'}</td>
        <td>${c.teacher_name || '<span style="color:var(--gray-400)">-</span>'}</td>
        <td style="font-size:12px;color:var(--gray-400)">${timeAgo(c.connected_at)}</td>
      </tr>
    `).join('');
  }

  const feed = document.getElementById('activityFeed');
  if (data.recent_events.length === 0) {
    feed.innerHTML = '<div style="text-align:center;padding:24px;color:var(--gray-400)">No recent activity</div>';
  } else {
    feed.innerHTML = data.recent_events.map(e => {
      let icon, color, label;
      if (e.type === 'project_status') {
        icon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--green-600)" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';
        color = 'var(--green-700)';
        label = 'Repo Linked';
      } else if (e.type === 'upload') {
        icon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--dark-blue-600)" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>';
        color = 'var(--dark-blue-700)';
        label = 'New Commits';
      } else {
        icon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--orange-600)" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>';
        color = 'var(--orange-700)';
        label = 'Teacher Comment';
      }
      return '<div style="display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--gray-100)"><div style="flex-shrink:0;margin-top:2px">' + icon + '</div><div style="flex:1;font-size:13px"><div style="display:flex;gap:6px;align-items:center"><span style="font-weight:600;color:' + color + ';font-size:11px">' + label + '</span><span style="color:var(--gray-400);font-size:11px">' + timeAgo(e.created_at) + '</span></div><div style="color:var(--gray-600);margin-top:2px">' + (e.project_title !== '(unknown)' ? '<strong>' + e.project_title + '</strong> — ' : '') + e.message + '</div><div style="font-size:11px;color:var(--gray-400);margin-top:1px">' + (e.group_name !== '(unknown)' ? e.group_name : '') + (e.teacher_name !== '(unknown)' ? ' &middot; ' + e.teacher_name : '') + '</div></div></div>';
    }).join('');
  }
}
load();
</script>
</body>
</html>
