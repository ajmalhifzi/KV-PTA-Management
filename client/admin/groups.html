<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KV PTA — Groups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="main-content">
  <div id="header" class="top-header"></div>
  <div class="content-area">
    <div class="card" style="padding:0;margin-bottom:24px">
      <div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
        <span style="font-weight:600;font-size:14px;color:var(--text-primary)">Groups</span>
        <button class="btn btn-primary btn-sm" onclick="showCreateModal()">+ New Group</button>
      </div>
      <div class="group-grid" id="groupsList" style="padding:16px"></div>
    </div>
  </div>
</div>

<div id="createModal" class="modal-overlay" onclick="if(event.target===this)closeCreateModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>Create Group</h3>
    <div class="form-group"><label class="form-label">Group Name</label><input class="form-input" id="newGroupName"></div>
    <div class="form-group"><label class="form-label">Teacher</label><select class="form-input" id="newGroupTeacher"></select></div>
    <div id="createMsg" style="font-size:13px;margin-bottom:8px;display:none"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeCreateModal()">Cancel</button>
      <button class="btn btn-primary" onclick="handleCreate()">Create</button>
    </div>
  </div>
</div>

<div id="assignModal" class="modal-overlay" onclick="if(event.target===this)closeAssignModal()">
  <div class="modal" onclick="event.stopPropagation()" style="max-width:500px">
    <h3>Assign Students to Group</h3>
    <p style="font-size:13px;color:var(--text-secondary);margin-bottom:12px" id="assignGroupName"></p>
    <input type="hidden" id="assignGroupId">
    <div class="form-group">
      <label class="form-label">Select Students</label>
      <div id="studentCheckboxes" style="max-height:250px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;padding:8px"></div>
    </div>
    <div id="assignMsg" style="font-size:13px;margin-bottom:8px;display:none"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeAssignModal()">Cancel</button>
      <button class="btn btn-primary" onclick="handleAssign()">Save</button>
    </div>
  </div>
</div>

<div id="confirmModal" class="modal-overlay" onclick="if(event.target===this)closeConfirm()">
  <div class="modal" onclick="event.stopPropagation()" style="max-width:380px">
    <h3>Confirm Delete</h3>
    <p style="font-size:14px;color:var(--text-secondary);margin-bottom:16px" id="confirmText"></p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeConfirm()">Cancel</button>
      <button class="btn btn-primary" style="background:var(--red)" id="confirmBtn">Delete</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
const user = requireAuth();
if (user.role !== 'admin') redirectByRole(user.role);
renderPage('Groups');

let deleteTargetId = null;

async function load() {
  const groups = await get('/api/admin/groups');
  const container = document.getElementById('groupsList');
  if (groups.length === 0) {
    container.innerHTML = '<div class="empty-state" style="padding:32px;width:100%;text-align:center"><p>No groups yet</p></div>';
  } else {
    container.innerHTML = groups.map(g => `
      <div class="card" style="padding:20px;display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <span style="font-weight:700;font-size:15px;color:var(--primary)">${g.group_name}</span>
          <span class="badge badge-blue">${g.student_count} students</span>
        </div>
        <div style="font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:6px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          ${g.teacher_name || '<span style="color:var(--text-muted)">No teacher assigned</span>'}
        </div>
        <div style="font-size:12px;color:var(--text-muted)">Created ${new Date(g.created_at).toLocaleDateString()}</div>
        <div style="display:flex;gap:8px;margin-top:4px">
          <button class="btn btn-soft btn-sm" onclick="showAssignModal('${g.id}','${g.group_name.replace(/'/g,"\\'")}')">Assign Students</button>
          <button class="btn btn-sm" style="background:var(--bg-card);color:var(--red);border:1px solid var(--red-light)" onclick="confirmDelete('${g.id}','${g.group_name.replace(/'/g,"\\'")}')">Delete</button>
        </div>
      </div>
    `).join('');
  }
}

async function showCreateModal() {
  document.getElementById('newGroupName').value = '';
  document.getElementById('createMsg').style.display = 'none';
  const teachers = await get('/api/admin/teachers');
  const sel = document.getElementById('newGroupTeacher');
  sel.innerHTML = teachers.map(t => `<option value="${t.id}">${t.full_name}</option>`).join('');
  document.getElementById('createModal').style.display = 'flex';
  document.getElementById('createModal').classList.add('open');
}

function closeCreateModal() { document.getElementById('createModal').style.display = 'none'; document.getElementById('createModal').classList.remove('open'); }

async function handleCreate() {
  const group_name = document.getElementById('newGroupName').value.trim();
  const teacher_id = document.getElementById('newGroupTeacher').value;
  const msg = document.getElementById('createMsg');
  if (!group_name) { msg.textContent = 'Group name required'; msg.style.color = 'var(--red)'; msg.style.display = 'block'; return; }
  try {
    await post('/api/admin/groups', { group_name, teacher_id });
    closeCreateModal();
    load();
  } catch (e) {
    msg.textContent = e.message;
    msg.style.color = 'var(--red)'; msg.style.display = 'block';
  }
}

async function showAssignModal(groupId, groupName) {
  document.getElementById('assignGroupId').value = groupId;
  document.getElementById('assignGroupName').textContent = 'Group: ' + groupName;
  document.getElementById('assignMsg').style.display = 'none';

  const [students, assigned] = await Promise.all([
    get('/api/admin/students'),
    get('/api/admin/groups/' + groupId + '/students').catch(() => []),
  ]);
  const assignedIds = new Set(assigned.map(s => s.id));

  const container = document.getElementById('studentCheckboxes');
  container.innerHTML = students.map(s => {
    const checked = assignedIds.has(s.id) ? 'checked' : '';
    return '<label style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;cursor:pointer;font-size:14px">' +
      '<input type="checkbox" class="student-cb" value="' + s.id + '" ' + checked + '> ' + s.full_name + ' (' + s.email + ')</label>';
  }).join('');

  document.getElementById('assignModal').style.display = 'flex';
  document.getElementById('assignModal').classList.add('open');
}

function closeAssignModal() { document.getElementById('assignModal').style.display = 'none'; document.getElementById('assignModal').classList.remove('open'); }

async function handleAssign() {
  const groupId = document.getElementById('assignGroupId').value;
  const cbs = document.querySelectorAll('.student-cb:checked');
  const student_ids = Array.from(cbs).map(cb => cb.value);
  const msg = document.getElementById('assignMsg');
  try {
    await api('/api/admin/groups/' + groupId + '/students', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ student_ids }),
    });
    msg.textContent = 'Students assigned!';
    msg.style.color = 'var(--green)'; msg.style.display = 'block';
    setTimeout(() => { closeAssignModal(); load(); }, 1000);
  } catch (e) {
    msg.textContent = e.message;
    msg.style.color = 'var(--red)'; msg.style.display = 'block';
  }
}

function confirmDelete(id, name) {
  deleteTargetId = id;
  document.getElementById('confirmText').textContent = 'Delete group "' + name + '"? Students will be unassigned.';
  document.getElementById('confirmModal').style.display = 'flex';
  document.getElementById('confirmModal').classList.add('open');
  document.getElementById('confirmBtn').onclick = handleDelete;
}

function closeConfirm() { document.getElementById('confirmModal').style.display = 'none'; document.getElementById('confirmModal').classList.remove('open'); deleteTargetId = null; }

async function handleDelete() {
  try {
    await api('/api/admin/groups/' + deleteTargetId, { method: 'DELETE' });
    closeConfirm();
    load();
  } catch (e) {
    document.getElementById('confirmText').textContent = 'Error: ' + e.message;
  }
}

load();
</script>
</body>
</html>
