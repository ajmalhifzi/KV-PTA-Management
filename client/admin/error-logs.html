<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KV PTA — Error Logs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="main-content">
  <div id="header" class="top-header"></div>
  <div class="content-area">
    <div class="card" style="padding:0">
      <div style="padding:16px 20px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;color:var(--text-primary)">System Error Logs</div>
      <div class="table-wrapper"><table><thead><tr><th>Level</th><th>Message</th><th>Route</th><th>Time</th></tr></thead><tbody id="logsList"></tbody></table></div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
const user = requireAuth();
if (user.role !== 'admin') redirectByRole(user.role);
renderPage('Error Logs');

async function load() {
  const logs = await get('/api/admin/error-logs');
  const tbody = document.getElementById('logsList');
  if (logs.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty-state" style="padding:32px"><p>No errors logged</p></td></tr>';
  } else {
    tbody.innerHTML = logs.map(l => `
      <tr>
        <td><span class="badge ${l.level === 'error' ? 'badge-red' : l.level === 'warn' ? 'badge-yellow' : 'badge-blue'}">${l.level}</span></td>
        <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${l.message}</td>
        <td style="color:var(--text-muted);font-size:13px">${l.route || '-'}</td>
        <td style="color:var(--text-muted);font-size:13px">${new Date(l.created_at).toLocaleString()}</td>
      </tr>
    `).join('');
  }
}
load();
</script>
</body>
</html>
