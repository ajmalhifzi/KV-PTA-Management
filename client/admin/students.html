<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students - KV PTA Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="main-content">
  <div id="header" class="top-header"></div>
  <div class="content-area">
    <div class="card" style="padding:0">
      <div style="padding:16px 20px;border-bottom:1px solid var(--gray-200);display:flex;justify-content:space-between;align-items:center">
        <span style="font-weight:600;font-size:14px;color:var(--dark-blue-800)">All Students</span>
        <a class="btn btn-primary btn-sm" href="/admin/groups.html">Manage Groups</a>
      </div>
      <div class="table-container"><table><thead><tr><th>Name</th><th>Email</th><th>Group</th><th>Joined</th></tr></thead><tbody id="studentsList"></tbody></table></div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
const user = requireAuth();
if (user.role !== 'admin') redirectByRole(user.role);
renderPage('Students');

async function load() {
  const [students, groups] = await Promise.all([
    get('/api/admin/students'),
    get('/api/admin/groups'),
  ]);
  const groupMap = {};
  groups.forEach(g => { groupMap[g.id] = g.group_name; });

  const tbody = document.getElementById('studentsList');
  if (students.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty-state" style="padding:32px"><p>No students registered</p></td></tr>';
  } else {
    tbody.innerHTML = students.map(s => `
      <tr>
        <td>${s.full_name}</td>
        <td>${s.email}</td>
        <td>${s.group_id ? '<span class="badge badge-blue">' + (groupMap[s.group_id] || 'Unknown') + '</span>' : '<span class="badge badge-gray">Unassigned</span>'}</td>
        <td style="color:var(--gray-400);font-size:13px">${new Date(s.created_at).toLocaleDateString()}</td>
      </tr>
    `).join('');
  }
}
load();
</script>
</body>
</html>
