<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students - KV PTA Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="main-content">
  <div id="header" class="top-header"></div>
  <div class="content-area">
    <div class="card" style="padding:0">
      <div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
        <span style="font-weight:600;font-size:14px;color:var(--text-primary)">All Students</span>
        <a class="btn btn-primary btn-sm" href="/admin/groups.html">Manage Groups</a>
      </div>
      <div style="padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap" id="studentFilters">
        <button class="filter-chip active" data-filter="all" onclick="filterStudents('all')">All</button>
        <button class="filter-chip" data-filter="unassigned" onclick="filterStudents('unassigned')">Unassigned</button>
      </div>
      <div class="table-wrapper"><table><thead><tr><th>Name</th><th>Email</th><th>Group</th><th>Teacher</th><th>Joined</th></tr></thead><tbody id="studentsList"></tbody></table></div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
const user = requireAuth();
if (user.role !== 'admin') redirectByRole(user.role);
renderPage('Students');

let allStudents = [];
let studentFilter = 'all';

async function load() {
  allStudents = await get('/api/admin/students');
  renderStudents();
}

function renderStudents() {
  const tbody = document.getElementById('studentsList');
  const students = studentFilter === 'unassigned' ? allStudents.filter(s => !s.group_id) : allStudents;
  if (students.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-state" style="padding:32px"><p>No students found</p></td></tr>';
  } else {
    tbody.innerHTML = students.map(s => `
      <tr>
        <td>${s.full_name}</td>
        <td>${s.email}</td>
        <td>${s.group_id ? '<span class="badge badge-blue">' + s.group_name + '</span>' : '<span class="badge badge-gray">Unassigned</span>'}</td>
        <td>${s.teacher_name || '<span style="color:var(--text-muted)">-</span>'}</td>
        <td style="color:var(--text-muted);font-size:13px">${new Date(s.created_at).toLocaleDateString()}</td>
      </tr>
    `).join('');
  }
}

function filterStudents(f) {
  studentFilter = f;
  document.querySelectorAll('#studentFilters .filter-chip').forEach(c => c.classList.toggle('active', c.dataset.filter === f));
  renderStudents();
}
load();
</script>
</body>
</html>
