<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teachers - KV PTA Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="main-content">
  <div id="header" class="top-header"></div>
  <div class="content-area" id="teachersContainer"></div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
const user = requireAuth();
if (user.role !== 'admin') redirectByRole(user.role);
renderPage('Teachers');

async function load() {
  const groups = await get('/api/admin/groups');
  const teachers = await get('/api/admin/teachers');

  const teacherGroups = {};
  groups.forEach(g => {
    if (!teacherGroups[g.teacher_id]) teacherGroups[g.teacher_id] = { teacher_name: g.teacher_name, groups: [] };
    teacherGroups[g.teacher_id].groups.push(g);
  });

  const container = document.getElementById('teachersContainer');

  if (teachers.length === 0) {
    container.innerHTML = '<div class="card" style="text-align:center;padding:48px"><p style="color:var(--text-secondary)">No teachers registered</p></div>';
    return;
  }

  container.innerHTML = teachers.map(t => {
    const tg = teacherGroups[t.id];
    return `
      <div class="card" style="padding:0;margin-bottom:16px">
        <div style="padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--primary-lighter)">
          <div>
            <span style="font-weight:700;font-size:15px;color:var(--text-primary)">${t.full_name}</span>
            <span style="font-size:13px;color:var(--text-secondary);margin-left:10px">${t.email}</span>
          </div>
          <span class="badge badge-blue">${tg ? tg.groups.reduce((sum, g) => sum + g.students.length, 0) : 0} students</span>
        </div>
        ${tg
          ? tg.groups.map(g => `
            <div style="border-bottom:1px solid var(--border-light)">
              <div style="padding:10px 20px;font-size:13px;font-weight:600;color:var(--primary);background:var(--primary-lighter)">${g.group_name}</div>
              ${g.students.length === 0
                ? '<div style="padding:10px 20px;font-size:13px;color:var(--text-muted)">No students</div>'
                : g.students.map(s => `
                  <div style="padding:8px 20px 8px 36px;font-size:14px;border-top:1px solid var(--primary-lighter);display:flex;justify-content:space-between">
                    <span>${s.full_name}</span>
                    <span style="color:var(--text-muted);font-size:13px">${s.email}</span>
                  </div>
                `).join('')
              }
            </div>
          `).join('')
          : '<div style="padding:14px 20px;font-size:13px;color:var(--text-muted)">No groups assigned</div>'
        }
      </div>
    `;
  }).join('');
}
load();
</script>
</body>
</html>
