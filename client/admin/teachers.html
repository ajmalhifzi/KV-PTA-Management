<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teachers - KV PTA Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="main-content">
  <div id="header" class="top-header"></div>
  <div class="content-area">
    <div class="card" style="padding:0">
      <div style="padding:16px 20px;border-bottom:1px solid var(--gray-200);display:flex;justify-content:space-between;align-items:center">
        <span style="font-weight:600;font-size:14px;color:var(--dark-blue-800)">All Teachers</span>
      </div>
      <div class="table-container"><table><thead><tr><th>Name</th><th>Email</th><th>Joined</th></tr></thead><tbody id="teachersList"></tbody></table></div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
const user = requireAuth();
if (user.role !== 'admin') redirectByRole(user.role);
renderPage('Teachers');

async function load() {
  const teachers = await get('/api/admin/teachers');
  const tbody = document.getElementById('teachersList');
  if (teachers.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" class="empty-state" style="padding:32px"><p>No teachers registered</p></td></tr>';
  } else {
    tbody.innerHTML = teachers.map(t => `
      <tr><td>${t.full_name}</td><td>${t.email}</td><td style="color:var(--gray-400);font-size:13px">${new Date(t.created_at).toLocaleDateString()}</td></tr>
    `).join('');
  }
}
load();
</script>
</body>
</html>
