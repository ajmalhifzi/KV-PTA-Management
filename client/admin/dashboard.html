<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Overview - KV PTA Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="main-content">
  <div id="header" class="top-header"></div>
  <div class="content-area">
    <div class="stat-grid" id="statCards"></div>
    <div class="card" style="padding:0">
      <div style="padding:16px 20px;border-bottom:1px solid var(--gray-200);font-weight:600;font-size:14px;color:var(--dark-blue-800)">Teachers & Student Counts</div>
      <div class="table-container"><table id="teachersTable"><thead><tr><th>Teacher</th><th>Students</th></tr></thead><tbody></tbody></table></div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
const user = requireAuth();
if (user.role !== 'admin') redirectByRole(user.role);
renderPage('Overview');

async function load() {
  const data = await get('/api/admin/overview');

  const stats = {};
  data.user_stats.forEach(s => stats[s.role] = s.count);
  const projects = {};
  data.project_stats.forEach(s => projects[s.status] = s.count);

  document.getElementById('statCards').innerHTML = `
    <div class="card stat-card">
      <div class="stat-icon blue"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
      <div><div class="stat-number">${stats.teacher || 0}</div><div class="stat-label">Teachers</div></div>
    </div>
    <div class="card stat-card">
      <div class="stat-icon green"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>
      <div><div class="stat-number">${stats.student || 0}</div><div class="stat-label">Students</div></div>
    </div>
    <div class="card stat-card">
      <div class="stat-icon yellow"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></div>
      <div><div class="stat-number">${projects.submitted || 0}</div><div class="stat-label">Pending Reviews</div></div>
    </div>
    <div class="card stat-card">
      <div class="stat-icon blue"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></div>
      <div><div class="stat-number">${(projects.approved || 0) + (projects.rejected || 0) + (projects.revision || 0)}</div><div class="stat-label">Reviewed</div></div>
    </div>
    <div class="card stat-card">
      <div class="stat-icon green"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
      <div><div class="stat-number">${data.group_count || 0}</div><div class="stat-label">Groups</div></div>
    </div>
  `;

  const tbody = document.querySelector('#teachersTable tbody');
  if (data.teachers.length === 0) {
    tbody.innerHTML = '<tr><td colspan="2" class="empty-state" style="padding:32px"><p>No teachers found</p></td></tr>';
  } else {
    tbody.innerHTML = data.teachers.map(t => `
      <tr><td>${t.full_name}</td><td><span class="badge badge-blue">${t.student_count} students</span></td></tr>
    `).join('');
  }
}
load();
</script>
</body>
</html>
