<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Overview - KV PTA Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="main-content">
  <div id="header" class="top-header"></div>
  <div class="content-area">
    <div class="stat-grid" id="statCards">    </div>
    <div id="activityCard" class="card-accent" style="margin-bottom:16px;display:none">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--primary-deep)" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span style="font-size:13px;font-weight:600;color:var(--primary-deep)">Project Status Overview</span>
      </div>
      <div id="activityList" style="display:flex;gap:24px;flex-wrap:wrap"></div>
    </div>
    <div class="card" style="padding:0">
      <div style="padding:16px 20px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;color:var(--text-primary)">Teachers & Student Counts</div>
      <div class="table-wrapper"><table id="teachersTable"><thead><tr><th>Teacher</th><th>Students</th></tr></thead><tbody></tbody></table></div>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
const user = requireAuth();
if (user.role !== 'admin') redirectByRole(user.role);
renderPage('Overview');

async function load() {
  const skeletonCards = document.getElementById('statCards');
  const skeletonTbody = document.querySelector('#teachersTable tbody');
  skeletonCards.innerHTML = Array(6).fill('<div class="stat-card"><div class="skeleton skeleton-stat" style="margin-bottom:8px"></div><div class="skeleton skeleton-stat" style="width:50%"></div></div>').join('');
  skeletonTbody.innerHTML = Array(3).fill('<tr><td colspan="2"><div class="skeleton skeleton-row"></div></td></tr>').join('');
  const data = await get('/api/admin/overview');

  const stats = {};
  data.user_stats.forEach(s => stats[s.role] = s.count);
  const projects = {};
  data.project_stats.forEach(s => projects[s.status] = s.count);

const totalUsers = (stats.admin || 0) + (stats.teacher || 0) + (stats.student || 0);
  const studentsAssigned = data.teachers.reduce((sum, t) => sum + (t.student_count || 0), 0);
  const unassignedStudents = Math.max(0, (stats.student || 0) - studentsAssigned);
  const reviewed = (projects.approved || 0) + (projects.rejected || 0) + (projects.revision || 0);

  const statCards = [
    { label: 'Total Users', value: totalUsers, icon: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>' },
    { label: 'Teachers', value: stats.teacher || 0, icon: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>' },
    { label: 'Unassigned Students', value: unassignedStudents, danger: unassignedStudents > 0, icon: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>' },
    { label: 'Pending Reviews', value: projects.submitted || 0, icon: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>' },
    { label: 'Reviewed', value: reviewed, icon: '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>' },
    { label: 'Groups', value: data.group_count || 0, icon: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>' },
  ];

  document.getElementById('statCards').innerHTML = statCards.map(c => `
    <div class="stat-card animate-in ${c.danger ? 'stat-card-danger' : ''}">
      <div class="stat-label">${c.label}</div>
      <div class="stat-value">${c.value}</div>
      ${c.danger ? '<div class="stat-trend negative">needs action</div>' : ''}
      <div class="stat-icon-float">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${c.icon}</svg>
      </div>
    </div>
  `).join('');

  const statusColors = { draft: 'var(--text-muted)', submitted: 'var(--yellow)', approved: 'var(--green)', rejected: 'var(--red)', revision: 'var(--yellow)' };
  const statusLabels = { draft: 'Draft', submitted: 'Submitted', approved: 'Approved', rejected: 'Rejected', revision: 'Revision' };
  const actCard = document.getElementById('activityCard');
  const actList = document.getElementById('activityList');
  const statusItems = data.project_stats.filter(s => s.status !== 'draft');
  if (statusItems.length > 0) {
    actCard.style.display = 'block';
    actList.innerHTML = statusItems.map(s => `
      <div style="display:flex;align-items:center;gap:8px">
        <span style="width:10px;height:10px;border-radius:50%;background:${statusColors[s.status] || 'var(--text-muted)'}"></span>
        <span style="font-size:13px;color:var(--text-secondary)">${statusLabels[s.status] || s.status}:</span>
        <strong style="font-size:15px;color:var(--text-primary)">${s.count}</strong>
      </div>
    `).join('');
  }

  const tbody = document.querySelector('#teachersTable tbody');
  if (data.teachers.length === 0) {
    tbody.innerHTML = '<tr><td colspan="2" class="empty-state" style="padding:32px"><p>No teachers found</p></td></tr>';
  } else {
    tbody.innerHTML = data.teachers.map(t => `
      <tr><td>${t.full_name}</td><td><span class="badge badge-blue">${t.student_count} students</span></td></tr>
    `).join('');
  }
}
load();
</script>
</body>
</html>
