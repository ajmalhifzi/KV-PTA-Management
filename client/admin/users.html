<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users - KV PTA Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="main-content">
  <div id="header" class="top-header"></div>
  <div class="content-area">
    <div class="card" style="padding:0">
      <div style="padding:16px 20px;border-bottom:1px solid var(--gray-200);font-weight:600;font-size:14px;color:var(--dark-blue-800)">All Users</div>
      <div class="table-container"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th style="width:140px">Actions</th></tr></thead><tbody id="usersList"></tbody></table></div>
    </div>
  </div>
</div>

<div id="editModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeEditModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <h3>Edit User</h3>
    <input type="hidden" id="editId">
    <div class="form-group"><label class="form-label">Full Name</label><input class="form-input" id="editName"></div>
    <div class="form-group"><label class="form-label">Email</label><input class="form-input" id="editEmail" type="email"></div>
    <div class="form-group"><label class="form-label">Role</label><select class="form-input" id="editRole"><option value="student">Student</option><option value="teacher">Teacher</option><option value="admin">Admin</option></select></div>
    <div class="form-group"><label class="form-label">New Password (leave blank to keep)</label><input class="form-input" id="editPassword" type="password" placeholder="Optional"></div>
    <div id="editMsg" style="font-size:13px;margin-bottom:8px;display:none"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
      <button class="btn btn-primary" onclick="handleUpdate()">Save</button>
    </div>
  </div>
</div>

<div id="confirmModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeConfirmModal()">
  <div class="modal" onclick="event.stopPropagation()" style="max-width:380px">
    <h3>Confirm Delete</h3>
    <p style="font-size:14px;color:var(--gray-600);margin-bottom:16px" id="confirmText"></p>
    <div id="confirmMsg" style="font-size:13px;margin-bottom:8px;display:none"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeConfirmModal()">Cancel</button>
      <button class="btn btn-primary" style="background:#c92a2a" id="confirmBtn">Delete</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
const user = requireAuth();
if (user.role !== 'admin') redirectByRole(user.role);
renderPage('Users');

async function load() {
  const users = await get('/api/admin/users');
  const tbody = document.getElementById('usersList');
  if (users.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-state" style="padding:32px"><p>No users found</p></td></tr>';
  } else {
    const roleBadge = { admin: 'badge-red', teacher: 'badge-blue', student: 'badge-green' };
    tbody.innerHTML = users.map(u => `
      <tr>
        <td>${u.full_name}</td>
        <td>${u.email}</td>
        <td><span class="badge ${roleBadge[u.role] || 'badge-gray'}">${u.role}</span></td>
        <td style="color:var(--gray-400);font-size:13px">${new Date(u.created_at).toLocaleDateString()}</td>
        <td>
          <button class="btn btn-soft btn-sm" onclick="openEdit('${u.id}','${u.full_name.replace(/'/g,"\\'")}','${u.email}','${u.role}')">Edit</button>
          <button class="btn btn-sm" style="background:#fff;color:#c92a2a;border:1px solid #ffc9c9" onclick="confirmDelete('${u.id}','${u.full_name.replace(/'/g,"\\'")}')">Delete</button>
        </td>
      </tr>
    `).join('');
  }
}

function openEdit(id, fullName, email, role) {
  document.getElementById('editId').value = id;
  document.getElementById('editName').value = fullName;
  document.getElementById('editEmail').value = email;
  document.getElementById('editRole').value = role;
  document.getElementById('editPassword').value = '';
  document.getElementById('editMsg').style.display = 'none';
  document.getElementById('editModal').style.display = 'flex';
}

function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }

async function handleUpdate() {
  const id = document.getElementById('editId').value;
  const body = {};
  const name = document.getElementById('editName').value.trim();
  const email = document.getElementById('editEmail').value.trim();
  const role = document.getElementById('editRole').value;
  const password = document.getElementById('editPassword').value;
  if (name) body.full_name = name;
  if (email) body.email = email;
  body.role = role;
  if (password) body.password = password;

  const msg = document.getElementById('editMsg');
  try {
    await api('/api/admin/users/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    msg.textContent = 'Updated!';
    msg.style.color = '#2b8a3e'; msg.style.display = 'block';
    closeEditModal();
    load();
  } catch (e) {
    msg.textContent = e.message;
    msg.style.color = '#c92a2a'; msg.style.display = 'block';
  }
}

let deleteTargetId = null;

function confirmDelete(id, name) {
  deleteTargetId = id;
  document.getElementById('confirmText').textContent = 'Delete "' + name + '"? This cannot be undone.';
  document.getElementById('confirmMsg').style.display = 'none';
  document.getElementById('confirmModal').style.display = 'flex';
  document.getElementById('confirmBtn').onclick = handleDelete;
}

function closeConfirmModal() { document.getElementById('confirmModal').style.display = 'none'; deleteTargetId = null; }

async function handleDelete() {
  const msg = document.getElementById('confirmMsg');
  try {
    await api('/api/admin/users/' + deleteTargetId, { method: 'DELETE' });
    closeConfirmModal();
    load();
  } catch (e) {
    msg.textContent = e.message;
    msg.style.color = '#c92a2a'; msg.style.display = 'block';
  }
}

load();
</script>
</body>
</html>
