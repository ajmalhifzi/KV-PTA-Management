<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Files - KV PTA Management</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="sidebar" class="sidebar"></div>
<div class="main-content">
  <div id="header" class="top-header"></div>
  <div class="content-area">

    <div class="card" style="padding:0;margin-bottom:24px">
      <div style="padding:16px 20px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;color:var(--text-primary)">Student Uploads</div>
      <div id="uploadsContainer" style="padding:16px 20px"></div>
    </div>

    <div class="card" style="padding:0">
      <div style="padding:16px 20px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;color:var(--text-primary)">Teacher Resources</div>
      <div id="resourcesContainer" style="padding:16px 20px"></div>
    </div>

  </div>
</div>

<div id="confirmModal" class="modal-overlay" onclick="if(event.target===this)closeConfirm()">
  <div class="modal" onclick="event.stopPropagation()" style="max-width:380px">
    <h3>Confirm Delete</h3>
    <p style="font-size:14px;color:var(--text-secondary);margin-bottom:16px" id="confirmText"></p>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeConfirm()">Cancel</button>
      <button class="btn btn-primary" style="background:var(--red)" id="confirmBtn">Delete</button>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script>
const user = requireAuth();
if (user.role !== 'admin') redirectByRole(user.role);
renderPage('Files');

function renderFileCard(file, opts) {
  const date = new Date(file.uploaded_at || file.created_at);
  const timeStr = date.toLocaleTimeString('en-MY', { hour: '2-digit', minute: '2-digit' });
  const badgeClass = opts.badgeClass || (file.category === 'formal' ? 'badge-blue' : 'badge-gray');
  const badgeLabel = opts.badgeLabel || file.category || file.file_type || '-';
  const icon = opts.icon || '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>';
  return `
    <div style="border:1.5px solid var(--border);border-radius:8px;padding:10px 14px;display:flex;align-items:center;gap:12px;margin-bottom:6px">
      <div style="width:34px;height:34px;border-radius:6px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icon}</svg>
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:13px;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
          <a href="${opts.downloadUrl}" target="_blank" style="color:inherit;text-decoration:none">${file.file_name || file.title}</a>
        </div>
        <div style="font-size:11px;color:var(--text-secondary);margin-top:1px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span>${opts.subtitle}</span>
          <span>·</span>
          <span class="badge ${badgeClass}" style="font-size:9px;padding:1px 6px">${badgeLabel}</span>
          <span>·</span>
          <span>${timeStr}</span>
        </div>
      </div>
      ${opts.deleteBtn || ''}
    </div>
  `;
}

function renderDateSections(items, opts) {
  if (items.length === 0) {
    return '<div style="padding:8px 0;text-align:center;color:var(--text-muted);font-size:13px">' + opts.emptyMsg + '</div>';
  }
  const groups = {};
  for (const item of items) {
    const d = new Date(item.uploaded_at || item.created_at);
    const key = d.toISOString().split('T')[0];
    if (!groups[key]) groups[key] = [];
    groups[key].push(item);
  }
  const today = new Date().toISOString().split('T')[0];
  const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
  const labels = { [today]: 'Today', [yesterday]: 'Yesterday' };

  return Object.keys(groups).sort((a, b) => b.localeCompare(a)).map(key => {
    const label = labels[key] || new Date(key + 'T12:00:00').toLocaleDateString('en-MY', { day: 'numeric', month: 'short', year: 'numeric' });
    return `
      <div style="font-weight:700;font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;margin:12px 0 6px">${label}</div>
      ${groups[key].map(item => renderFileCard(item, opts(item))).join('')}
    `;
  }).join('');
}

async function load() {
  const [uploads, resources] = await Promise.all([
    get('/api/admin/uploads'),
    get('/api/admin/resources'),
  ]);

  document.getElementById('uploadsContainer').innerHTML = renderDateSections(uploads, u => ({
    downloadUrl: '/api/files/uploads/' + u.id,
    subtitle: u.uploader_name || 'Unknown',
    badgeClass: u.category === 'formal' ? 'badge-blue' : 'badge-gray',
    badgeLabel: u.category,
    emptyMsg: 'No uploads',
    deleteBtn: '<button class="btn btn-sm" style="background:var(--bg-card);color:var(--red);border:1px solid var(--red-light);flex-shrink:0;font-size:11px;padding:3px 8px" onclick="deleteUpload(\'' + u.id + '\')">Delete</button>'
  }));

  document.getElementById('resourcesContainer').innerHTML = renderDateSections(resources, r => ({
    downloadUrl: '/api/files/resources/' + r.id,
    subtitle: r.teacher_name,
    badgeClass: 'badge-blue',
    badgeLabel: r.file_type || '-',
    emptyMsg: 'No resources',
    deleteBtn: '<button class="btn btn-sm" style="background:var(--bg-card);color:var(--red);border:1px solid var(--red-light);flex-shrink:0;font-size:11px;padding:3px 8px" onclick="deleteResource(\'' + r.id + '\')">Delete</button>'
  }));
}

let deleteAction = null;

function confirmThen(fn) {
  deleteAction = fn;
  document.getElementById('confirmText').textContent = 'Delete this file? This cannot be undone.';
  document.getElementById('confirmModal').style.display = 'flex';
  document.getElementById('confirmModal').classList.add('open');
  document.getElementById('confirmBtn').onclick = async function() {
    await deleteAction();
    closeConfirm();
    load();
  };
}

function closeConfirm() { document.getElementById('confirmModal').style.display = 'none'; document.getElementById('confirmModal').classList.remove('open'); deleteAction = null; }

async function deleteUpload(id) {
  confirmThen(() => api('/api/admin/uploads/' + id, { method: 'DELETE' }));
}

async function deleteResource(id) {
  confirmThen(() => api('/api/admin/resources/' + id, { method: 'DELETE' }));
}

load();
</script>
</body>
</html>
